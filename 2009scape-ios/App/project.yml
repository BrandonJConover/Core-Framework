# iOS app shell for the native Swift 2009scape client.
# Generate the Xcode project with `xcodegen generate` in this folder.
name: Scape530
options:
  bundleIdPrefix: com.brandonconover
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  Scape530:
    path: ..
targets:
  Scape530App:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: Scape530
        product: Scape530
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: Network.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "2009scape"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        # ProMotion: allow display rates above 60 Hz on iPhone.
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocalNetworkUsageDescription: "Connects to a 2009scape server on your local network."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonconover.scape530
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: false
        # The software raster and decoders are far faster with optimisation on.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
