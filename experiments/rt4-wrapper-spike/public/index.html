<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>RT4 Wrapper Spike</title>
    <link rel="icon" href="data:,">
    <link rel="apple-touch-icon" href="data:,">
    <script src="wrapper-config.js"></script>
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        width: 100dvw;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        background: #111;
        color: #eee;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #display {
        position: fixed;
        inset: 0;
        width: 100dvw;
        height: 100dvh;
        overflow: hidden;
        touch-action: none;
        transform-origin: top left;
        will-change: transform;
        background: #000;
      }

      #display * {
        touch-action: none;
      }

      #cheerpjDisplay {
        width: 100% !important;
        height: 100% !important;
        min-width: 100% !important;
        min-height: 100% !important;
        max-width: none !important;
        max-height: none !important;
      }

      #cheerpjDisplay .cjWindow,
      #cheerpjDisplay .cjWindow div,
      #cheerpjDisplay canvas {
        width: 100% !important;
        height: 100% !important;
        min-width: 100% !important;
        min-height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        transform-origin: top left !important;
      }

      #panel {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 2147483647;
        max-width: min(680px, calc(100vw - 24px));
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.35;
        pointer-events: none;
      }

      #panel.collapsed {
        max-width: none;
        padding: 0;
        background: transparent;
        border: 0;
      }

      #panel.collapsed #status,
      #panel.collapsed #log,
      #panel.collapsed #login-link,
      #panel.collapsed #launch-main,
      #panel.collapsed #launch-jar,
      #panel.collapsed #clear-log {
        display: none;
      }

      #panel.collapsed .actions {
        margin: 0;
      }

      #status {
        font-weight: 650;
      }

      #log {
        max-height: 28vh;
        margin-top: 6px;
        overflow: auto;
        white-space: pre-wrap;
        color: #cfcfcf;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      button {
        padding: 5px 8px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font: inherit;
        pointer-events: auto;
      }

      #login-link {
        display: none;
        margin-top: 6px;
        color: #9bd4ff;
        pointer-events: auto;
      }

      #touch-controls {
        position: fixed;
        right: max(8px, env(safe-area-inset-right));
        top: max(8px, env(safe-area-inset-top));
        z-index: 2147483647;
        display: none;
        gap: 4px;
        pointer-events: auto;
        opacity: 0.42;
        transform: scale(0.82);
        transform-origin: top right;
        transition: opacity 120ms ease;
      }

      #touch-controls:focus-within,
      #touch-controls:hover {
        opacity: 1;
      }

      #touch-controls.visible {
        display: flex;
      }

      #touch-controls button {
        min-width: 32px;
        min-height: 32px;
        padding: 0;
        background: rgba(0, 0, 0, 0.66);
        backdrop-filter: blur(8px);
        font-size: 13px;
      }

      #zoom-reset {
        display: none;
      }

      .keyboard-proxy {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 2147483646;
        width: 48px;
        height: 32px;
        border: 0;
        padding: 0;
        opacity: 0.01;
        color: transparent;
        background: transparent;
        caret-color: transparent;
        font-size: 16px;
        pointer-events: none;
        -webkit-user-select: text;
        user-select: text;
      }

      #tap-marker {
        position: fixed;
        z-index: 2147483645;
        display: none;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        border: 2px solid #5eead4;
        border-radius: 50%;
        background: rgba(94, 234, 212, 0.22);
        pointer-events: none;
      }

      #input-debug-layer {
        position: fixed;
        inset: 0;
        z-index: 2147483644;
        pointer-events: none;
      }

      #layout-debug-badge {
        position: fixed;
        left: max(8px, env(safe-area-inset-left));
        bottom: max(8px, env(safe-area-inset-bottom));
        z-index: 2147483644;
        display: none;
        max-width: calc(100vw - 16px - env(safe-area-inset-left) - env(safe-area-inset-right));
        padding: 5px 7px;
        border-radius: 5px;
        background: rgba(0, 0, 0, 0.72);
        color: #d1fae5;
        font: 11px/1.25 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        pointer-events: none;
        white-space: pre-wrap;
      }

      .input-debug-rect {
        position: fixed;
        border: 2px solid #facc15;
        background: rgba(250, 204, 21, 0.14);
        color: #fef3c7;
        font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-shadow: 0 1px 1px #000;
        box-sizing: border-box;
      }

      @media (hover: none), (pointer: coarse) {
        #panel {
          left: max(8px, env(safe-area-inset-left));
          top: max(8px, env(safe-area-inset-top));
          max-width: min(560px, calc(100vw - 16px - env(safe-area-inset-left) - env(safe-area-inset-right)));
          font-size: 12px;
        }

        #panel:not(.collapsed) #log {
          max-height: 18vh;
        }

        #touch-controls.visible {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="display" tabindex="-1"></div>
    <div id="panel" class="collapsed">
      <div id="status">Loading CheerpJ...</div>
      <div class="actions">
        <button id="launch-main" type="button">Run main()</button>
        <button id="launch-jar" type="button">Run jar</button>
        <button id="clear-log" type="button">Clear log</button>
        <button id="toggle-panel" type="button">Show log</button>
      </div>
      <a id="login-link" href="#" rel="noopener">Complete network login</a>
      <div id="log"></div>
    </div>
    <div id="touch-controls" aria-label="Touch controls">
      <button id="zoom-out" type="button" title="Zoom out">-</button>
      <button id="zoom-reset" type="button" title="Reset zoom">1x</button>
      <button id="zoom-in" type="button" title="Zoom in">+</button>
      <button id="show-keyboard" type="button" title="Show keyboard">KB</button>
    </div>
    <input id="keyboard-proxy" class="keyboard-proxy" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text">
    <div id="input-debug-layer"></div>
    <div id="layout-debug-badge"></div>
    <div id="tap-marker"></div>
    <script>
      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const loginLink = document.getElementById("login-link");
      const displayEl = document.getElementById("display");
      const touchControlsEl = document.getElementById("touch-controls");
      const keyboardProxyEl = document.getElementById("keyboard-proxy");
      const inputDebugLayerEl = document.getElementById("input-debug-layer");
      const layoutDebugBadgeEl = document.getElementById("layout-debug-badge");
      const tapMarkerEl = document.getElementById("tap-marker");
      const wrapperConfig = window.RT4_WRAPPER_CONFIG || {};
      const queryParams = new URLSearchParams(window.location.search);
      const tapDebugEnabled = wrapperConfig.tapDebug === true || queryParams.has("tapdebug");
      const inputDebugEnabled = wrapperConfig.inputDebug === true || queryParams.has("inputdebug");
      const gestureDebugEnabled = wrapperConfig.gestureDebug === true || queryParams.has("gesturedebug");
      const layoutDebugEnabled = wrapperConfig.layoutDebug === true || queryParams.has("layoutdebug");
      const layoutBadgeEnabled = wrapperConfig.layoutBadge === true || queryParams.has("layoutbadge");
      const mouseDebugEnabled = wrapperConfig.mouseDebug === true || queryParams.has("mousedebug");
      const wheelDebugEnabled = wrapperConfig.wheelDebug === true || queryParams.has("wheeldebug");
      const wrapperDebugEnabled = wrapperConfig.debug === true || queryParams.has("debug");
      const wrapperLogEnabled = wrapperConfig.log === true || queryParams.has("log") || wrapperDebugEnabled || tapDebugEnabled || inputDebugEnabled || gestureDebugEnabled || layoutDebugEnabled || mouseDebugEnabled || wheelDebugEnabled || wrapperConfig.showLogByDefault === true;
      const maxLogLines = Math.max(20, Number(wrapperConfig.maxLogLines || 120));
      const loginKeyboardFallbackEnabled = wrapperConfig.loginKeyboardFallback !== false;
      const loginKeyboardFallbackStates = new Set(wrapperConfig.loginKeyboardFallbackStates || [10, 20]);
      const rt4ClientJar = wrapperConfig.clientJar || "/app/rt4-wrapper/client-1.0.0-mobile15.jar";
      const rt4LauncherJar = wrapperConfig.launcherJar || "/app/rt4-wrapper/rt4-spike-launcher-mobile15.jar";
      let initialized = false;
      let displayCreated = false;
      let running = false;
      const wrapperLogLines = [];
      let lastCheerpJSizeKey = "";
      let layoutSyncRaf = 0;
      let lastPreloadLogAt = 0;
      let lastPreloadDone = -1;
      let lastDesktopPrimaryMouseDownAt = 0;
      let lastDesktopSecondaryMouseDownAt = 0;
      let browserResizeVersion = 1;
      let lastLogicalSizeKey = "";
      let lastViewportSizeKey = "";
      let nextSocketId = 1;
      const browserSockets = new Map();
      const browserInputKeyQueue = [];
      const browserInputCharQueue = [];
      const browserInputKeyDownQueue = [];
      const browserInputKeyUpQueue = [];
      const browserInputMouseQueue = [];
      let browserInputMouseEvent = null;
      let browserInputWheelRotation = 0;
      let browserInputCameraZoom = 0;
      let browserGameState = 0;
      let browserGameplayLayoutActive = false;
      let browserLoginState = {
        valid: false,
        loginStep: 0,
        loginReply: -2,
        loginAutoStep: 0,
        createStep: 0,
        worldListStep: 0,
        topLevelInterface: -1,
      };
      let keyboardProxyActive = false;
      let pendingKeyboardRefocus = null;
      let loginFallbackSuppressedUntil = 0;
      let browserInputFrame = {
        gameState: 0,
        canvasWidth: 0,
        canvasHeight: 0,
        fields: [],
      };
      window.__rt4InputFields = browserInputFrame.fields;
      window.__rt4InputFrame = browserInputFrame;
      const touchState = {
        enabled: wrapperConfig.mobileTouch !== false,
        fitScale: 1,
        userScale: Number(wrapperConfig.initialScale || 1),
        minUserScale: Number(wrapperConfig.minScale || 1),
        maxUserScale: Number(wrapperConfig.maxScale || 2.5),
        logicalWidth: window.innerWidth,
        logicalHeight: window.innerHeight,
        offsetX: 0,
        offsetY: 0,
        rotated: false,
        rotatePortrait: wrapperConfig.rotatePortrait === true,
        activeMouse: false,
        singleTouchId: null,
        inputHit: null,
        pinch: null,
        longPressTimer: null,
        longPressFired: false,
        swipeMode: false,
        swipeKey: null,
        swipeLastKeyAt: 0,
        swipeRemainderX: 0,
        swipeRemainderY: 0,
        swipeLastX: 0,
        swipeLastY: 0,
        startX: 0,
        startY: 0,
        lastX: 0,
        lastY: 0,
        lastTapAt: 0,
        lastTouchEndAt: 0,
      };
      window.__rt4TouchState = touchState;

      function isPanelExpanded() {
        const panel = document.getElementById("panel");
        return panel && !panel.classList.contains("collapsed");
      }

      function writeLog(message, options = {}) {
        if (options.debugOnly === true && !wrapperLogEnabled) return;
        const shouldPersist = options.important === true || wrapperLogEnabled || isPanelExpanded();
        if (!shouldPersist) return;
        const line = new Date().toLocaleTimeString() + " " + message;
        wrapperLogLines.push(line);
        while (wrapperLogLines.length > maxLogLines) {
          wrapperLogLines.shift();
        }
        logEl.textContent = wrapperLogLines.join("\n");
        if (isPanelExpanded()) {
          logEl.scrollTop = logEl.scrollHeight;
        }
        if (options.important === true || wrapperLogEnabled) {
          console.log("[rt4-wrapper]", message);
        }
      }

      function setStatus(message) {
        statusEl.textContent = message;
        writeLog(message, { important: true });
      }

      window.addEventListener("error", event => {
        setStatus("Browser error: " + (event.message || "unknown"));
      });

      window.addEventListener("unhandledrejection", event => {
        const reason = event.reason && event.reason.message ? event.reason.message : String(event.reason);
        setStatus("Unhandled rejection: " + reason);
      });

      document.getElementById("clear-log").addEventListener("click", () => {
        wrapperLogLines.length = 0;
        logEl.textContent = "";
      });

      document.getElementById("toggle-panel").addEventListener("click", () => {
        const panel = document.getElementById("panel");
        const collapsed = panel.classList.toggle("collapsed");
        document.getElementById("toggle-panel").textContent = collapsed ? "Show log" : "Hide log";
      });

      function setPanelVisible(visible) {
        const panel = document.getElementById("panel");
        panel.classList.toggle("collapsed", !visible);
        document.getElementById("toggle-panel").textContent = visible ? "Hide log" : "Show log";
      }

      setPanelVisible(wrapperConfig.showLogByDefault === true || tapDebugEnabled);
      if (tapDebugEnabled) {
        writeLog("Tap debug enabled.");
      }
      if (inputDebugEnabled) {
        writeLog("Input debug overlay enabled.");
      }
      if (gestureDebugEnabled) {
        writeLog("Gesture debug enabled.");
      }
      if (layoutDebugEnabled) {
        writeLog("Layout debug enabled.");
      }
      if (mouseDebugEnabled) {
        writeLog("Mouse debug enabled.");
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function numberOption(name, fallback) {
        const raw = queryParams.has(name) ? queryParams.get(name) : wrapperConfig[name];
        const value = Number(raw);
        return Number.isFinite(value) ? value : fallback;
      }

      function booleanOption(name, fallback) {
        if (queryParams.has(name)) {
          const value = queryParams.get(name);
          return value === "" || value === "1" || value === "true" || value === "yes";
        }
        if (typeof wrapperConfig[name] === "boolean") {
          return wrapperConfig[name];
        }
        return fallback;
      }

      function applyDisplayTransform() {
        touchState.userScale = clamp(touchState.userScale, touchState.minUserScale, touchState.maxUserScale);
        const totalScale = touchState.fitScale * touchState.userScale;
        const transforms = [
          "translate(" + touchState.offsetX + "px, " + touchState.offsetY + "px)",
          "scale(" + totalScale + ")",
        ];
        if (touchState.rotated) {
          transforms.push("rotate(90deg)");
        }
        displayEl.style.transform = transforms.join(" ");
      }

      function isCoarsePointer() {
        return window.matchMedia("(hover: none), (pointer: coarse)").matches;
      }

      function shouldShowTouchControls() {
        return isCoarsePointer() && (wrapperConfig.showTouchControls === true || queryParams.has("controls"));
      }

      function shouldUseTouchHarness() {
        return touchState.enabled && isCoarsePointer();
      }

      function shouldUseNativeTouchMouseEvents() {
        return shouldUseTouchHarness() && booleanOption("mobileNativeMouseEvents", false);
      }

      function shouldUseBrowserMouseBridge() {
        return shouldUseTouchHarness() && booleanOption("mobileDirectMouse", true);
      }

      function shouldUseDesktopTrackpadGestures() {
        return !isCoarsePointer() && wrapperConfig.desktopTrackpadGestures !== false;
      }

      function fixedGameWidth() {
        return Math.max(765, Math.round(Number(wrapperConfig.gameWidth || wrapperConfig.desktopGameWidth || 765)));
      }

      function fixedGameHeight() {
        return Math.max(503, Math.round(Number(wrapperConfig.gameHeight || wrapperConfig.desktopGameHeight || 503)));
      }

      function shouldUseResizableGameSurface() {
        if (shouldUseTouchHarness()) return booleanOption("mobileResizable", false);
        if (queryParams.has("resizable")) return true;
        return booleanOption("desktopResizable", false);
      }

      function shouldUseMobileFitSurface() {
        return shouldUseTouchHarness() && wrapperConfig.mobileFitSurface !== false;
      }

      function shouldUseDesktopFitSurface() {
        return !shouldUseTouchHarness() && !shouldUseResizableGameSurface() && booleanOption("desktopFitSurface", true);
      }

      function isGameplayStateValue(state) {
        const value = Number(state);
        return Number.isFinite(value) && value >= 25;
      }

      function isLoginFallbackStateValue(state) {
        return loginKeyboardFallbackStates.has(Number(state));
      }

      function isGameplayLayoutActive() {
        return isGameplayStateValue(browserGameState);
      }

      function mobileFitMode(portrait) {
        const mode = queryParams.get("mobileFitMode") || wrapperConfig.mobileFitMode;
        if (mode === "cover" || mode === "contain" || mode === "aspect" || mode === "balanced") return mode;
        if (isGameplayLayoutActive()) {
          const gameplayMode = portrait
            ? wrapperConfig.mobileGameplayPortraitFitMode || wrapperConfig.mobileGameplayFitMode
            : wrapperConfig.mobileGameplayLandscapeFitMode || wrapperConfig.mobileGameplayFitMode;
          if (gameplayMode === "cover" || gameplayMode === "contain" || gameplayMode === "aspect" || gameplayMode === "balanced") return gameplayMode;
          return "aspect";
        }
        const portraitMode = wrapperConfig.mobilePortraitFitMode;
        if (portrait && (portraitMode === "cover" || portraitMode === "contain" || portraitMode === "aspect" || portraitMode === "balanced")) return portraitMode;
        return portrait ? "balanced" : "aspect";
      }

      function normalizedFitMode(mode, fallback) {
        return mode === "cover" || mode === "contain" || mode === "aspect" || mode === "balanced" ? mode : fallback;
      }

      function mobileFixedFitMode(portrait) {
        const queryMode = queryParams.get("mobileFixedFitMode");
        if (queryMode) return normalizedFitMode(queryMode, portrait ? "balanced" : "contain");
        const configured = portrait
          ? wrapperConfig.mobileFixedPortraitFitMode || wrapperConfig.mobileFixedFitMode
          : wrapperConfig.mobileFixedLandscapeFitMode || wrapperConfig.mobileFixedFitMode;
        return normalizedFitMode(configured, portrait ? "balanced" : "contain");
      }

      function mobileBalancedScale(portrait) {
        const viewport = viewportSize();
        const targetVisibleWidth = clamp(
          numberOption("mobilePortraitVisibleWidth", Number(wrapperConfig.mobilePortraitVisibleWidth || 520)),
          220,
          765
        );
        const fallback = portrait ? viewport.width / targetVisibleWidth : 1;
        const raw = queryParams.has("mobilePortraitScale")
          ? queryParams.get("mobilePortraitScale")
          : queryParams.has("mobileBalancedScale")
            ? queryParams.get("mobileBalancedScale")
            : wrapperConfig.mobilePortraitScale || wrapperConfig.mobileBalancedScale;
        const value = Number(raw);
        return Number.isFinite(value) ? clamp(value, 0.35, 2.5) : fallback;
      }

      function mobileViewportCenter(portrait, axis, fallback) {
        const queryName = axis === "x" ? "mobilePortraitCenterX" : "mobilePortraitCenterY";
        const configName = axis === "x" ? "mobilePortraitCenterX" : "mobilePortraitCenterY";
        const raw = portrait && queryParams.has(queryName)
          ? queryParams.get(queryName)
          : portrait
            ? wrapperConfig[configName]
            : null;
        const value = raw === null || raw === undefined || raw === "" ? NaN : Number(raw);
        return Number.isFinite(value) ? value : fallback;
      }

      function positionDisplayForGameCenter(viewport, width, height, scale, centerX, centerY) {
        const left = viewport.width / 2 - centerX * scale;
        const top = viewport.height / 2 - centerY * scale;
        displayEl.style.left = left + "px";
        displayEl.style.top = top + "px";
      }

      function mobileMinGameWidth() {
        return Math.max(320, Math.round(Number(wrapperConfig.mobileMinGameWidth || wrapperConfig.gameWidth || 765)));
      }

      function mobileMinGameHeight() {
        return Math.max(240, Math.round(Number(wrapperConfig.mobileMinGameHeight || wrapperConfig.gameHeight || 503)));
      }

      function viewportSize() {
        return {
          width: Math.max(1, Math.round(window.innerWidth)),
          height: Math.max(1, Math.round(window.innerHeight)),
        };
      }

      function currentViewportSizeKey() {
        const viewport = viewportSize();
        return viewport.width + "x" + viewport.height + ":" + (shouldUseResizableGameSurface() ? "resizable" : "fixed") + ":" + (shouldUseMobileFitSurface() ? "fit" : "raw") + ":" + (touchState.rotatePortrait ? "rotate" : "normal");
      }

      function ensureLayoutFresh() {
        const viewportKey = currentViewportSizeKey();
        if (viewportKey !== lastViewportSizeKey) {
          syncOrientationLayout();
        }
      }

      function syncOrientationLayout(forceCheerpJSize = false) {
        const viewport = viewportSize();
        const portrait = viewport.height > viewport.width;
        const resizableSurface = shouldUseResizableGameSurface();
        const shouldRotate = resizableSurface && touchState.enabled && touchState.rotatePortrait && isCoarsePointer() && portrait;
        touchState.rotated = shouldRotate;
        document.body.classList.toggle("is-portrait", portrait);
        document.body.classList.toggle("is-landscape", !portrait);
        document.body.classList.toggle("is-rotated", shouldRotate);
        touchControlsEl.classList.toggle("visible", shouldShowTouchControls());

        if (shouldRotate) {
          const width = viewport.height;
          const height = viewport.width;
          touchState.logicalWidth = width;
          touchState.logicalHeight = height;
          touchState.fitScale = 1;
          displayEl.style.inset = "auto";
          displayEl.style.width = width + "px";
          displayEl.style.height = height + "px";
          displayEl.style.left = (viewport.width - width) / 2 + "px";
          displayEl.style.top = (viewport.height - height) / 2 + "px";
        } else if (shouldUseMobileFitSurface()) {
          const fixedMobileSurface = shouldUseTouchHarness() && !resizableSurface;
          const minWidth = fixedMobileSurface ? fixedGameWidth() : mobileMinGameWidth();
          const minHeight = fixedMobileSurface ? fixedGameHeight() : mobileMinGameHeight();
          const fitMode = fixedMobileSurface ? mobileFixedFitMode(portrait) : mobileFitMode(portrait);
          let width = minWidth;
          let height = minHeight;

          if (!fixedMobileSurface && fitMode === "aspect") {
            const aspect = viewport.width / viewport.height;
            width = viewport.width;
            height = viewport.height;

            if (width < minWidth || height < minHeight) {
              width = minWidth;
              height = Math.round(width / aspect);
              if (height < minHeight) {
                height = minHeight;
                width = Math.round(height * aspect);
              }
            }
          }

          const fitPadding = clamp(Number(wrapperConfig.fitPadding || 1), 0.8, 1);
          const containScale = Math.min(viewport.width / width, viewport.height / height, fixedMobileSurface ? Number.POSITIVE_INFINITY : 1);
          const coverScale = Math.max(viewport.width / width, viewport.height / height);
          const rawScale = fitMode === "cover"
            ? coverScale
            : fitMode === "balanced"
              ? clamp(mobileBalancedScale(portrait), containScale, coverScale)
              : containScale;
          const fitScale = rawScale * fitPadding;
          touchState.logicalWidth = Math.max(minWidth, Math.round(width));
          touchState.logicalHeight = Math.max(minHeight, Math.round(height));
          touchState.fitScale = fitScale;
          displayEl.style.inset = "auto";
          displayEl.style.width = touchState.logicalWidth + "px";
          displayEl.style.height = touchState.logicalHeight + "px";
          positionDisplayForGameCenter(
            viewport,
            touchState.logicalWidth,
            touchState.logicalHeight,
            fitScale,
            mobileViewportCenter(portrait, "x", touchState.logicalWidth / 2),
            mobileViewportCenter(portrait, "y", touchState.logicalHeight / 2)
          );
        } else if (resizableSurface) {
          touchState.logicalWidth = viewport.width;
          touchState.logicalHeight = viewport.height;
          touchState.fitScale = 1;
          displayEl.style.inset = "0";
          displayEl.style.width = viewport.width + "px";
          displayEl.style.height = viewport.height + "px";
          displayEl.style.left = "";
          displayEl.style.top = "";
        } else if (shouldUseDesktopFitSurface()) {
          const width = fixedGameWidth();
          const height = fixedGameHeight();
          const fitPadding = clamp(Number(wrapperConfig.desktopFitPadding || wrapperConfig.fitPadding || 1), 0.75, 1);

          userScale: touchState.userScale,

      function updateLayoutDebugBadge() {

          keyUpQueue: browserInputKeyUpQueue.length,
          wheelRotation: browserInputWheelRotation,

            cancelable: true,

        return {

        keyboardProxyEl.style.left = Math.round(rect.left) + "px";
        keyboardProxyEl.style.top = Math.round(rect.top) + "px";
        keyboardProxyEl.style.width = Math.max(48, Math.round(rect.width)) + "px";
        keyboardProxyEl.style.height = Math.max(32, Math.round(rect.height)) + "px";
        keyboardProxyEl.style.bottom = "auto";

      function renderInputDebugOverlay() {
        if (!inputDebugEnabled) return;
        inputDebugLayerEl.textContent = "";

        const fields = realFields.length > 0 ? realFields : loginFallbackFields();
        for (const field of fields) {
          const rect = clientRectForInputField(field);
          const el = document.createElement("div");
          el.className = "input-debug-rect";
          el.textContent = (field.fallback ? "fallback " : "#") + field.id;
          el.style.left = Math.round(rect.left) + "px";
          el.style.top = Math.round(rect.top) + "px";
          el.style.width = Math.max(2, Math.round(rect.width)) + "px";
          el.style.height = Math.max(2, Math.round(rect.height)) + "px";
          inputDebugLayerEl.appendChild(el);
        }
      }

      function inspectTap(label, x, y, inputHit, proxyFocused) {
        if (!tapDebugEnabled) return;
        const point = gamePointFromClient(x, y);
        const rect = displayEl.getBoundingClientRect();
        const target = gameTargetAt(x, y);
        const viewport = viewportSize();
        const payload = {
          label,
          clientX: Math.round(x),
          clientY: Math.round(y),
          gameX: Math.round(point.x),
          gameY: Math.round(point.y),
          gameState: browserGameState,
          inputFieldHit: Boolean(inputHit && inputHit.field),
          inputField: inputHit && inputHit.field ? {
            id: inputHit.field.id,
            name: inputHit.field.name || null,
            x: inputHit.field.x,
            y: inputHit.field.y,
            width: inputHit.field.width,
            height: inputHit.field.height,
            fallback: Boolean(inputHit.field.fallback),
          } : null,
          inputFieldSource: inputHit ? inputHit.source : null,
          reportedInputFields: browserInputFrame.fields.length,
          loginState: { ...browserLoginState },
          loginKeyboardFallbackState: isLoginKeyboardFallbackState(),
          loginFallbackSuppressed: Date.now() < loginFallbackSuppressedUntil,
          loginFallbackSuppressedMs: Math.max(0, Math.round(loginFallbackSuppressedUntil - Date.now())),

        tapMarkerEl.style.left = Math.round(x) + "px";
        tapMarkerEl.style.top = Math.round(y) + "px";

        tapMarkerEl._hideTimer = window.setTimeout(() => {
          tapMarkerEl.style.display = "none";

      function decorateGameCoordinates(event, point) {

        const y = Math.round(point.y);

            Object.defineProperty(event, key, { configurable: true, get: () => x });
          } catch (_) {

            Object.defineProperty(event, key, { configurable: true, get: () => y });
          } catch (_) {

          y: rect.top + point.y * scale,

          cancelable: true,

          clientY: client.y,

          cancelable: true,
          view: window,
          clientX: client.x,
          clientY: client.y,
          screenX: window.screenX + client.x,
          screenY: window.screenY + client.y,

          buttons,

            cancelable: true,
            view: window,
            clientX: client.x,
            clientY: client.y,
            deltaY,
            deltaMode: 0,

            cancelable: true,
            view: window,
            clientX: client.x,
            clientY: client.y,

            wheelDelta: -deltaY,

        const nextGameplay = isGameplayStateValue(nextState);
        browserGameState = nextState;
        browserGameplayLayoutActive = nextGameplay;

          window.__rt4InputFrame = browserInputFrame;

        lastPulseAt: 0,
        safariScale: 1,

      }

      function releaseDesktopTrackpadKey() {

        const key = desktopGestureState.activeKey.key;
        desktopGestureState.activeKey = null;
        queueRt4KeyUp(code);
        recordGesture("trackpad-key-up", { key, code });

            : { key: "ArrowUp", code: "ArrowUp", keyCode: 38 }

          y: Math.round(clientY),

          y: Math.round(event.clientY),
          rawDeltaX: Math.round(event.deltaX),
          rawDeltaY: Math.round(event.deltaY),
          deltaX: Math.round(deltaX),
          deltaY: Math.round(deltaY),
          deltaMode: event.deltaMode,
          ctrlKey: event.ctrlKey,
          target: event.target && event.target.tagName ? event.target.tagName.toLowerCase() : String(event.target),

          writeLog("wheel " + JSON.stringify(payload));
        }

          markTrackpadWheelHandled(event);
          event.preventDefault();
          event.stopPropagation();
          queueDesktopTrackpadZoom(-deltaY, event.clientX, event.clientY);
          return true;
        }
        const horizontal = Math.abs(deltaX);
        const vertical = Math.abs(deltaY);

          markTrackpadWheelHandled(event);
          event.preventDefault();
          event.stopPropagation();
          queueDesktopTrackpadSwipe("y", -deltaY, event.clientX, event.clientY);
          return true;
        }

          markTrackpadWheelHandled(event);
          event.preventDefault();
          event.stopPropagation();
          queueDesktopTrackpadSwipe("x", deltaX, event.clientX, event.clientY);
          return true;
        }

      }

      function queueDesktopTrackpadZoom(delta, clientX, clientY) {

        const sensitivity = clamp(numberOption("trackpadPinchSensitivity", 2.5), 0.25, 12);
        const maxSteps = clamp(Math.round(numberOption("trackpadPinchMaxSteps", 12)), 1, 24);

        const steps = clamp(Math.trunc(desktopGestureState.zoomRemainder / stepPx), -maxSteps, maxSteps);

          x: Math.round(clientX),
          y: Math.round(clientY),
          delta: Math.round(delta),
          scaledDelta: Math.round(scaledDelta),
          sensitivity,
          stepPx,
          zoomSteps: steps,
        });
      }

      function activeTouches(event) {
        const rect = displayEl.getBoundingClientRect();
        return Array.from(event.touches).filter(touch =>
          touch.clientX >= rect.left &&
          touch.clientX < rect.right &&
          touch.clientY >= rect.top &&
          touch.clientY < rect.bottom

        return touches.some(touch =>
          touch.clientX >= rect.left &&
          touch.clientX < rect.right &&
          touch.clientY >= rect.top &&
          touch.clientY < rect.bottom

        event.stopPropagation();

          y: (a.clientY + b.clientY) / 2,

        touchState.startY = touch.clientY;

        touchState.lastY = touch.clientY;

        touchState.swipeLastY = touch.clientY;

            touchState.lastY - touchState.startY,

        displayEl.addEventListener("contextmenu", event => {
          if (isCoarsePointer()) return;
          const now = Date.now();
          const looksLikePrimaryClickMenu = now - lastDesktopPrimaryMouseDownAt < 450 && now - lastDesktopSecondaryMouseDownAt > 450;
          event.preventDefault();
          if (looksLikePrimaryClickMenu) {
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === "function") {
              event.stopImmediatePropagation();
            }
            recordGesture("desktop-primary-contextmenu-suppressed", {
              x: Math.round(event.clientX),
              y: Math.round(event.clientY),
            });
          }
        }, true);

        window.addEventListener("wheel", handleDesktopTrackpadWheel, { capture: true, passive: false });
        document.addEventListener("wheel", handleDesktopTrackpadWheel, { capture: true, passive: false });
        displayEl.addEventListener("wheel", handleDesktopTrackpadWheel, { passive: false });

        displayEl.addEventListener("gesturestart", event => {
          if (!shouldUseDesktopTrackpadGestures() || !eventIsInDisplay(event)) return;
          event.preventDefault();
          desktopGestureState.safariScale = Number(event.scale || 1);
          recordGesture("trackpad-gesture-start", {
            x: Math.round(event.clientX),
            y: Math.round(event.clientY),
            scale: desktopGestureState.safariScale,
          });
        }, { passive: false });

        displayEl.addEventListener("gesturechange", event => {
          if (!shouldUseDesktopTrackpadGestures() || !eventIsInDisplay(event)) return;
          event.preventDefault();
          const scale = Number(event.scale || 1);
          const delta = (scale - desktopGestureState.safariScale) * numberOption("trackpadSafariPinchMultiplier", 260);
          desktopGestureState.safariScale = scale;
          queueDesktopTrackpadZoom(delta, event.clientX, event.clientY);
        }, { passive: false });

        displayEl.addEventListener("gestureend", event => {
          if (!shouldUseDesktopTrackpadGestures()) return;
          event.preventDefault();
          desktopGestureState.safariScale = 1;
          recordGesture("trackpad-gesture-end");
        }, { passive: false });
      }

      function installTouchControls() {
        if (!touchState.enabled) return;
        touchControlsEl.classList.toggle("visible", shouldShowTouchControls());
        document.getElementById("zoom-out").addEventListener("click", () => cameraZoomGame(1));
        document.getElementById("zoom-in").addEventListener("click", () => cameraZoomGame(-1));
        document.getElementById("zoom-reset").addEventListener("click", resetZoom);
        document.getElementById("show-keyboard").addEventListener("click", showKeyboard);

        const onTouchStart = event => {
          if (!isTouchEventInDisplay(event)) return;
          const touches = activeTouches(event);
          if (touches.length === 0) return;

          if (touches.length >= 2) {
            consumeGameTouchEvent(event);
            if (isKeyboardProxyActive()) hideKeyboard();
            if (touchState.activeMouse) endMouseTouch();
            const center = midpoint(touches[0], touches[1]);
            touchState.pinch = {
              distance: distance(touches[0], touches[1]),
              remainder: 0,
              centerX: center.x,
              centerY: center.y,
              startedAt: Date.now(),
            };
            recordGesture("pinch-start", { x: Math.round(center.x), y: Math.round(center.y), distance: Math.round(touchState.pinch.distance) });
            return;
          }

          if (!touchState.pinch && !touchState.activeMouse) {
            if (!shouldUseNativeTouchMouseEvents()) {
              consumeGameTouchEvent(event);
            }
            const inputHit = fieldAtClientPoint(touches[0].clientX, touches[0].clientY);
            const matchedInput = inputHit.field ? inputHit : null;
            const proxyFocused = beginMouseTouch(touches[0], matchedInput);
            inspectTap("touchstart", touches[0].clientX, touches[0].clientY, matchedInput, proxyFocused || document.activeElement === keyboardProxyEl);
          }
        };

        const onTouchMove = event => {
          if (!isTouchEventInDisplay(event) && !touchState.activeMouse && !touchState.pinch) return;
          const touches = activeTouches(event);
          if (touches.length === 0 && !touchState.activeMouse && !touchState.pinch) return;

          if (touches.length >= 2 && touchState.pinch) {
            consumeGameTouchEvent(event);
            const center = midpoint(touches[0], touches[1]);
            const nextDistance = distance(touches[0], touches[1]);
            const distanceDelta = nextDistance - touchState.pinch.distance;
            touchState.pinch.distance = nextDistance;
            touchState.pinch.centerX = center.x;
            touchState.pinch.centerY = center.y;

            if (Math.abs(distanceDelta) > 2) {
              const pinchSensitivity = clamp(numberOption("pinchSensitivity", 2), 0.25, 8);
              touchState.pinch.remainder += distanceDelta * pinchSensitivity;
              const pinchStepPx = clamp(numberOption("pinchStepPx", 3), 1, 40);
              const zoomSteps = clamp(Math.trunc(touchState.pinch.remainder / pinchStepPx), -12, 12);
              if (zoomSteps !== 0) {
                touchState.pinch.remainder -= zoomSteps * pinchStepPx;
                const deltaY = zoomSteps > 0 ? 180 : -180;
                cameraZoomGame(zoomSteps, center.x, center.y);
                recordGesture("pinch-zoom", {
                  x: Math.round(center.x),
                  y: Math.round(center.y),
                  distanceDelta: Math.round(distanceDelta),
                  pinchSensitivity,
                  zoomSteps,
                  deltaY,
                });
              }
            }
            return;
          }

          if (touchState.activeMouse) {
            const touch = touches.find(item => item.identifier === touchState.singleTouchId) || touches[0];
            if (!touch) return;
            updateMouseTouch(touch);
            if (!shouldUseNativeTouchMouseEvents() || touchState.swipeMode || touchState.longPressFired) {
              consumeGameTouchEvent(event);
            }
          }
        };

        const onTouchEnd = event => {
          if (!isTouchEventInDisplay(event) && !touchState.activeMouse && !touchState.pinch) return;
          const touches = activeTouches(event);
          if (touchState.pinch && touches.length < 2) {
            consumeGameTouchEvent(event);
            recordGesture("pinch-end");
            touchState.pinch = null;
            return;
          }
          if (touchState.activeMouse && !touches.some(touch => touch.identifier === touchState.singleTouchId)) {
            const consumeTouchEnd = !shouldUseNativeTouchMouseEvents() || touchState.swipeMode || touchState.longPressFired;
            endMouseTouch();
            if (consumeTouchEnd) {
              consumeGameTouchEvent(event);
            }
          }
        };

        const onTouchCancel = event => {
          if (!isTouchEventInDisplay(event) && !touchState.activeMouse && !touchState.pinch) return;
          consumeGameTouchEvent(event);
          touchState.pinch = null;
          endMouseTouch();
        };

        if (shouldUseTouchHarness()) {
          displayEl.addEventListener("contextmenu", event => event.preventDefault());
          document.addEventListener("click", event => {
            if (shouldUseNativeTouchMouseEvents() && displayEl.contains(event.target)) return;
            if (!isWrapperChromeTarget(event.target) && Date.now() - touchState.lastTouchEndAt < 700) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
          document.addEventListener("click", event => {
            if (!shouldUseNativeTouchMouseEvents() || !displayEl.contains(event.target)) return;
            if (!pendingKeyboardRefocus || Date.now() - pendingKeyboardRefocus.at > 900) return;
            const pending = pendingKeyboardRefocus;
            pendingKeyboardRefocus = null;
            if (!isLoginKeyboardFallbackState() && pending.field && pending.field.fallback) return;
            positionKeyboardProxyForField(pending.field);
            showKeyboard(pending.x, pending.y);
          }, false);

          document.addEventListener("touchstart", onTouchStart, { passive: false, capture: true });
          document.addEventListener("touchmove", onTouchMove, { passive: false, capture: true });
          document.addEventListener("touchend", onTouchEnd, { passive: false, capture: true });
          document.addEventListener("touchcancel", onTouchCancel, { passive: false, capture: true });
        }

        function requestLayoutSync() {
          if (layoutSyncRaf) return;
          layoutSyncRaf = window.requestAnimationFrame(() => {
            layoutSyncRaf = 0;
            syncOrientationLayout(true);
          });
        }

        function scheduleLayoutSync() {
          hideKeyboard();
          [0, 100, 300, 800, 1400].forEach(delay => window.setTimeout(requestLayoutSync, delay));
        }

        window.addEventListener("resize", scheduleLayoutSync);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", requestLayoutSync);
          window.visualViewport.addEventListener("scroll", requestLayoutSync);
        }
        window.addEventListener("orientationchange", () => {
          scheduleLayoutSync();
        });
        syncOrientationLayout();
      }

      installDesktopMouseAndTrackpad();
      installTouchControls();

      function defaultWebSocketUrl() {
        if (wrapperConfig.websocketUrl) return wrapperConfig.websocketUrl;
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        return protocol + "//" + window.location.host + "/rt4-ws";
      }

      function resolveWebSocketUrl(hostname, port) {
        const configured = defaultWebSocketUrl();
        if (!configured.includes("{host}") && !configured.includes("{port}")) {
          return configured;
        }
        return configured
          .replaceAll("{host}", encodeURIComponent(hostname))
          .replaceAll("{port}", String(port));
      }

      function getSocket(socketId) {
        const socket = browserSockets.get(socketId);
        if (!socket) throw new Error("unknown browser WebSocket socket " + socketId);
        return socket;
      }

      function wakeSocketReaders(socket) {
        const readers = socket.waiting.splice(0);
        for (const resolve of readers) resolve();
      }

      function enqueueSocketBytes(socket, bytes) {
        socket.queue.push(bytes);
        wakeSocketReaders(socket);
      }

      function dequeueSocketBytes(socket, out, off, len) {
        let written = 0;
        while (written < len && socket.queue.length > 0) {
          let chunk = socket.queue[0];
          const available = chunk.length - socket.queueOffset;
          const copyLen = Math.min(available, len - written);
          for (let i = 0; i < copyLen; i++) {
            out[off + written + i] = chunk[socket.queueOffset + i] & 0xff;
          }
          written += copyLen;
          socket.queueOffset += copyLen;
          if (socket.queueOffset >= chunk.length) {
            socket.queue.shift();
            socket.queueOffset = 0;
          }
        }
        return written;
      }

      async function Java_rt4_BrowserWebSocketNative_open(lib, hostname, port) {
        const url = resolveWebSocketUrl(String(hostname), Number(port));
        const socketId = nextSocketId++;
        writeLog("Opening browser WebSocket #" + socketId + " to " + url + " for " + hostname + ":" + port);

        const ws = new WebSocket(url);
        ws.binaryType = "arraybuffer";
        const socket = {
          ws,
          queue: [],
          queueOffset: 0,
          waiting: [],
          closed: false,
        };
        browserSockets.set(socketId, socket);

        await new Promise((resolve, reject) => {
          ws.onopen = resolve;
          ws.onerror = () => reject(new Error("WebSocket connection failed: " + url));
          ws.onclose = event => {
            socket.closed = true;
            wakeSocketReaders(socket);
            writeLog("Browser WebSocket #" + socketId + " closed (" + event.code + ").");
          };
          ws.onmessage = event => {
            if (event.data instanceof ArrayBuffer) {
              enqueueSocketBytes(socket, new Uint8Array(event.data));
            } else if (event.data instanceof Blob) {
              event.data.arrayBuffer().then(buffer => enqueueSocketBytes(socket, new Uint8Array(buffer)));
            } else if (typeof event.data === "string") {
              enqueueSocketBytes(socket, new TextEncoder().encode(event.data));
            }
          };
        });

        writeLog("Browser WebSocket #" + socketId + " connected.");
        return socketId;
      }

      async function Java_rt4_BrowserWebSocketNative_available(lib, socketId) {
        const socket = getSocket(socketId);
        let total = -socket.queueOffset;
        for (const chunk of socket.queue) total += chunk.length;
        return Math.max(0, total);
      }

      async function Java_rt4_BrowserWebSocketNative_readByte(lib, socketId) {
        const one = new Uint8Array(1);
        const read = await Java_rt4_BrowserWebSocketNative_readBytes(lib, socketId, one, 0, 1);
        return read < 0 ? -1 : one[0];
      }

      async function Java_rt4_BrowserWebSocketNative_readBytes(lib, socketId, bytes, off, len) {
        const socket = getSocket(socketId);
        while (socket.queue.length === 0) {
          if (socket.closed) return -1;
          await new Promise(resolve => socket.waiting.push(resolve));
        }
        return dequeueSocketBytes(socket, bytes, Number(off), Number(len));
      }

      async function Java_rt4_BrowserWebSocketNative_sendBytes(lib, socketId, bytes, off, len) {
        const result = await Java_rt4_BrowserWebSocketNative_trySendBytes(lib, socketId, bytes, off, len);
        if (result !== 0) {
          writeLog("Dropping write to closed browser WebSocket #" + socketId + ".");
        }
      }

      async function Java_rt4_BrowserWebSocketNative_sendByte(lib, socketId, value) {
        const result = await Java_rt4_BrowserWebSocketNative_trySendByte(lib, socketId, value);
        if (result !== 0) {
          writeLog("Dropping byte write to closed browser WebSocket #" + socketId + ".");
        }
      }

      async function Java_rt4_BrowserWebSocketNative_trySendBytes(lib, socketId, bytes, off, len) {
        const socket = getSocket(socketId);
        if (socket.closed || socket.ws.readyState !== WebSocket.OPEN) {
          return -1;
        }
        const start = Number(off);
        const end = start + Number(len);
        if (bytes && typeof bytes.subarray === "function") {
          socket.ws.send(bytes.subarray(start, end));
          return 0;
        }
        const out = new Uint8Array(Number(len));
        for (let i = 0; i < out.length; i++) {
          out[i] = bytes[start + i] & 0xff;
        }
        socket.ws.send(out);
        return 0;
      }

      async function Java_rt4_BrowserWebSocketNative_trySendByte(lib, socketId, value) {
        const socket = getSocket(socketId);
        if (socket.closed || socket.ws.readyState !== WebSocket.OPEN) {
          return -1;
        }
        socket.ws.send(new Uint8Array([Number(value) & 0xff]));
        return 0;
      }

      async function Java_rt4_BrowserWebSocketNative_close(lib, socketId) {
        const socket = browserSockets.get(socketId);
        if (!socket) return;
        socket.closed = true;
        browserSockets.delete(socketId);
        wakeSocketReaders(socket);
        socket.ws.close();
      }

      function Java_rt4_BrowserViewportNative_getWidth() {
        return browserViewportWidth();
      }

      function Java_rt4_BrowserViewportNative_getHeight() {
        return browserViewportHeight();
      }

      function Java_rt4_BrowserViewportNative_isPageVisible() {
        return document.visibilityState !== "hidden";
      }

      function Java_rt4_BrowserViewportNative_isResizable() {
        return shouldUseResizableGameSurface();
      }

      function Java_rt4_BrowserViewportNative_getResizeVersion() {
        ensureLayoutFresh();
        return browserResizeVersion;
      }

      function Java_rt4_BrowserInputNative_pollWheelRotation() {
        const rotation = browserInputWheelRotation;
        browserInputWheelRotation = 0;
        return rotation;
      }

      function Java_rt4_BrowserInputNative_pollCameraZoom() {
        const zoom = browserInputCameraZoom;
        browserInputCameraZoom = 0;
        return zoom;
      }

      function Java_rt4_BrowserInputNative_pollKeyCode() {
        if (browserInputKeyQueue.length === 0) return -1;
        return browserInputKeyQueue.shift();
      }

      function Java_rt4_BrowserInputNative_pollKeyChar() {
        if (browserInputCharQueue.length === 0) return -1;
        return browserInputCharQueue.shift();
      }

      function Java_rt4_BrowserInputNative_pollKeyDown() {
        if (browserInputKeyDownQueue.length === 0) return -1;
        return browserInputKeyDownQueue.shift();
      }

      function Java_rt4_BrowserInputNative_pollKeyUp() {
        if (browserInputKeyUpQueue.length === 0) return -1;
        return browserInputKeyUpQueue.shift();
      }

      function Java_rt4_BrowserInputNative_pollMouseEventType() {
        if (browserInputMouseQueue.length === 0) {
          browserInputMouseEvent = null;
          return 0;
        }
        browserInputMouseEvent = browserInputMouseQueue.shift();
        switch (browserInputMouseEvent.type) {
          case 1:
          case "move":
            return 1;
          case 2:
          case "down":
            return 2;
          case 3:
          case "up":
            return 3;
          case 4:
          case "exit":
            return 4;
          default:
            return 0;
        }
      }

      function Java_rt4_BrowserInputNative_pollMouseX() {
        return browserInputMouseEvent ? browserInputMouseEvent.x : 0;
      }

      function Java_rt4_BrowserInputNative_pollMouseY() {
        return browserInputMouseEvent ? browserInputMouseEvent.y : 0;
      }

      function Java_rt4_BrowserInputNative_pollMouseButton() {
        return browserInputMouseEvent ? browserInputMouseEvent.button : 1;
      }

      function Java_rt4_BrowserInputNative_setGameState(lib, state) {
        setBrowserGameState(state);
      }

      function Java_rt4_BrowserInputNative_beginInputFrame(lib, state, canvasWidth, canvasHeight) {
        setBrowserGameState(state);
        browserInputFrame = {
          gameState: browserGameState,
          canvasWidth: Number(canvasWidth),
          canvasHeight: Number(canvasHeight),
          fields: [],
        };
        window.__rt4InputFields = browserInputFrame.fields;
        window.__rt4InputFrame = browserInputFrame;
        renderInputDebugOverlay();
      }

      function Java_rt4_BrowserInputNative_setLoginState(lib, loginStep, loginReply, loginAutoStep, createStep, worldListStep, topLevelInterface) {
        browserLoginState = {
          valid: true,
          loginStep: Number(loginStep),
          loginReply: Number(loginReply),
          loginAutoStep: Number(loginAutoStep),
          createStep: Number(createStep),
          worldListStep: Number(worldListStep),
          topLevelInterface: Number(topLevelInterface),
        };
        window.__rt4LoginState = browserLoginState;
        if (browserLoginState.loginStep > 0 || browserLoginState.loginAutoStep > 0 || browserLoginState.loginReply === 2) {
          suppressLoginFallback("rt4-login-transition", 60000);
          if (isKeyboardProxyActive()) {
            hideKeyboard();
          }
        } else if (
          browserLoginState.loginStep === 0 &&
          browserLoginState.loginAutoStep === 0 &&
          browserLoginState.createStep === 0 &&
          browserLoginState.worldListStep === 0 &&
          browserLoginState.loginReply !== 2
        ) {
          clearLoginFallbackSuppression("rt4-login-form-idle");
        }
      }

      function Java_rt4_BrowserInputNative_reportTextInput(lib, id, x, y, width, height) {
        const field = {
          id: Number(id),
          x: Number(x),
          y: Number(y),
          width: Number(width),
          height: Number(height),
        };
        if (field.width <= 0 || field.height <= 0) return;
        browserInputFrame.fields.push(field);
        window.__rt4InputFields = browserInputFrame.fields;
        window.__rt4InputFrame = browserInputFrame;
        renderInputDebugOverlay();
      }

      async function ensureCheerpJ() {
        if (!initialized) {
          const enableDebug = wrapperDebugEnabled;
          setStatus("Initializing CheerpJ runtime" + (enableDebug ? " with debug logging" : "") + "...");
          const initOptions = {
            version: 8,
            status: "default",
            enableDebug,
            enableInputMethods: true,
            natives: {
              Java_rt4_BrowserWebSocketNative_open,
              Java_rt4_BrowserWebSocketNative_available,
              Java_rt4_BrowserWebSocketNative_readByte,
              Java_rt4_BrowserWebSocketNative_readBytes,
              Java_rt4_BrowserWebSocketNative_sendBytes,
              Java_rt4_BrowserWebSocketNative_sendByte,
              Java_rt4_BrowserWebSocketNative_trySendBytes,
              Java_rt4_BrowserWebSocketNative_trySendByte,
              Java_rt4_BrowserWebSocketNative_close,
              Java_rt4_BrowserViewportNative_getWidth,
              Java_rt4_BrowserViewportNative_getHeight,
              Java_rt4_BrowserViewportNative_isPageVisible,
              Java_rt4_BrowserViewportNative_isResizable,
              Java_rt4_BrowserViewportNative_getResizeVersion,
              Java_rt4_BrowserInputNative_pollWheelRotation,
              Java_rt4_BrowserInputNative_pollCameraZoom,
              Java_rt4_BrowserInputNative_pollKeyCode,
              Java_rt4_BrowserInputNative_pollKeyChar,
              Java_rt4_BrowserInputNative_pollKeyDown,
              Java_rt4_BrowserInputNative_pollKeyUp,
              Java_rt4_BrowserInputNative_pollMouseEventType,
              Java_rt4_BrowserInputNative_pollMouseX,
              Java_rt4_BrowserInputNative_pollMouseY,
              Java_rt4_BrowserInputNative_pollMouseButton,
              Java_rt4_BrowserInputNative_setGameState,
              Java_rt4_BrowserInputNative_beginInputFrame,
              Java_rt4_BrowserInputNative_setLoginState,
              Java_rt4_BrowserInputNative_reportTextInput,
            },
            preloadProgress: (done, total) => {
              if (total <= 0 || !wrapperLogEnabled) return;
              const now = Date.now();
              if (done === total || done !== lastPreloadDone && now - lastPreloadLogAt > 1000) {
                lastPreloadDone = done;
                lastPreloadLogAt = now;
                writeLog("CheerpJ preload " + done + " / " + total);
              }
            },
          };

          if (wrapperConfig.tailscaleControlUrl) {
            initOptions.tailscaleControlUrl = wrapperConfig.tailscaleControlUrl;
          }

          if (wrapperConfig.tailscaleAuthKey) {
            initOptions.tailscaleAuthKey = wrapperConfig.tailscaleAuthKey;
            writeLog("CheerpJ generalized networking enabled with an auth key.");
          } else if (wrapperConfig.useTailscaleLogin) {
            initOptions.tailscaleLoginUrlCb = function (url) {
              loginLink.href = url;
              loginLink.target = "_blank";
              loginLink.style.display = "inline-block";
              setStatus("Network login required. Open the login link, then return here.");
            };
            writeLog("CheerpJ generalized networking will prompt for login.");
          } else {
            writeLog("Using browser WebSocket bridge at " + defaultWebSocketUrl() + ".");
          }

          await cheerpjInit(initOptions);
          initialized = true;
          setStatus("CheerpJ initialized.");
        }

        if (!displayCreated) {
          setStatus("Creating Java display...");
          const parent = document.getElementById("display");
          cheerpjCreateDisplay(-1, -1, parent);
          displayCreated = true;
          forceCheerpJDisplaySize("display-created");
          setStatus("Java display created.");
        }
      }

      async function launchJar() {
        if (running) return;
        running = true;
        await ensureCheerpJ();
        setStatus("Starting RT4 via java -jar...");
        const exitCode = await cheerpjRunJar(
          rt4ClientJar,
          "--config",
          "/app/config.json",
          "1",
          "live",
          "english",
          "game0"
        );
        setStatus("RT4 jar exited with code " + exitCode + ".");
      }

      async function launchMain() {
        if (running) return;
        running = true;
        await ensureCheerpJ();
        setStatus("Starting RT4 via rt4.client main()...");
        const exitCode = await cheerpjRunMain(
          "spike.Rt4SpikeLauncher",
          rt4LauncherJar + ":" + rt4ClientJar,
          "--config",
          "/app/config.json",
          "1",
          "live",
          "english",
          "game0"
        );
        setStatus("RT4 main exited with code " + exitCode + ".");
      }

      document.getElementById("launch-jar").addEventListener("click", () => {
        launchJar().catch(error => {
          running = false;
          setStatus("Run jar failed: " + (error && error.message ? error.message : String(error)));
        });
      });

      document.getElementById("launch-main").addEventListener("click", () => {
        launchMain().catch(error => {
          running = false;
          setStatus("Run main failed: " + (error && error.message ? error.message : String(error)));
        });
      });

      launchMain().catch(error => {
        running = false;
        setStatus("Auto launch failed: " + (error && error.message ? error.message : String(error)));
      });
    </script>
