<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>RT4 Wrapper Spike</title>
    <link rel="icon" href="data:,">
    <link rel="apple-touch-icon" href="data:,">
    <script src="wrapper-config.js"></script>
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
    <style>
      :root {
        --rt4-safe-area-top: env(safe-area-inset-top, 0px);
        --rt4-safe-area-right: env(safe-area-inset-right, 0px);
        --rt4-safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --rt4-safe-area-left: env(safe-area-inset-left, 0px);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        width: 100dvw;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        background: #111;
        color: #eee;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #display {
        position: fixed;
        inset: 0;
        width: 100dvw;
        height: 100dvh;
        overflow: hidden;
        touch-action: none;
        transform-origin: top left;
        will-change: transform;
        background: #000;
      }

      #display * {
        touch-action: none;
      }

      #touch-capture-layer {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 5;
        display: none;
        width: 0;
        height: 0;
        background: transparent;
        pointer-events: none;
        touch-action: none;
      }

      body.touch-capture-active #touch-capture-layer {
        display: block;
        pointer-events: auto;
      }

      #cheerpjDisplay {
        width: 100% !important;
        height: 100% !important;
        min-width: 100% !important;
        min-height: 100% !important;
        max-width: none !important;
        max-height: none !important;
      }

      #cheerpjDisplay .cjWindow,
      #cheerpjDisplay .cjWindow div,
      #cheerpjDisplay canvas {
        width: 100% !important;
        height: 100% !important;
        min-width: 100% !important;
        min-height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        transform-origin: top left !important;
        image-rendering: auto;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
      }

      #panel {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 2147483647;
        max-width: min(680px, calc(100vw - 24px));
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.35;
        pointer-events: none;
      }

      #panel.collapsed {
        max-width: none;
        padding: 0;
        background: transparent;
        border: 0;
      }

      #panel.collapsed #status,
      #panel.collapsed #log,
      #panel.collapsed #login-link,
      #panel.collapsed #launch-main,
      #panel.collapsed #launch-jar,
      #panel.collapsed #clear-log {
        display: none;
      }

      #panel.collapsed .actions {
        margin: 0;
      }

      #status {
        font-weight: 650;
      }

      #log {
        max-height: 28vh;
        margin-top: 6px;
        overflow: auto;
        white-space: pre-wrap;
        color: #cfcfcf;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      button {
        padding: 5px 8px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font: inherit;
        pointer-events: auto;
      }

      #login-link {
        display: none;
        margin-top: 6px;
        color: #9bd4ff;
        pointer-events: auto;
      }

      #touch-controls {
        position: fixed;
        right: max(8px, env(safe-area-inset-right));
        top: max(8px, env(safe-area-inset-top));
        z-index: 2147483647;
        display: none;
        gap: 4px;
        pointer-events: auto;
        opacity: 0.42;
        transform: scale(0.82);
        transform-origin: top right;
        transition: opacity 120ms ease;
      }

      #touch-controls:focus-within,
      #touch-controls:hover {
        opacity: 1;
      }

      #touch-controls.visible {
        display: flex;
      }

      #touch-controls button {
        min-width: 32px;
        min-height: 32px;
        padding: 0;
        background: rgba(0, 0, 0, 0.66);
        backdrop-filter: blur(8px);
        font-size: 13px;
      }

      #zoom-reset {
        display: none;
      }

      .keyboard-proxy {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 2147483646;
        width: 48px;
        height: 32px;
        border: 0;
        padding: 0;
        opacity: 0.01;
        color: transparent;
        background: transparent;
        caret-color: transparent;
        font-size: 16px;
        pointer-events: none;
        -webkit-user-select: text;
        user-select: text;
      }

      #tap-marker {
        position: fixed;
        z-index: 2147483645;
        display: none;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        border: 2px solid #5eead4;
        border-radius: 50%;
        background: rgba(94, 234, 212, 0.22);
        pointer-events: none;
      }

      #input-debug-layer {
        position: fixed;
        inset: 0;
        z-index: 2147483644;
        pointer-events: none;
      }

      #layout-debug-badge {
        position: fixed;
        left: max(8px, env(safe-area-inset-left));
        bottom: max(8px, env(safe-area-inset-bottom));
        z-index: 2147483644;
        display: none;
        max-width: calc(100vw - 16px - env(safe-area-inset-left) - env(safe-area-inset-right));
        padding: 5px 7px;
        border-radius: 5px;
        background: rgba(0, 0, 0, 0.72);
        color: #d1fae5;
        font: 11px/1.25 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        pointer-events: none;
        white-space: pre-wrap;
      }

      .input-debug-rect {
        position: fixed;
        border: 2px solid #facc15;
        background: rgba(250, 204, 21, 0.14);
        color: #fef3c7;
        font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-shadow: 0 1px 1px #000;
        box-sizing: border-box;
      }

      @media (hover: none), (pointer: coarse) {
        #panel {
          left: max(8px, env(safe-area-inset-left));
          top: max(8px, env(safe-area-inset-top));
          max-width: min(560px, calc(100vw - 16px - env(safe-area-inset-left) - env(safe-area-inset-right)));
          font-size: 12px;
        }

        #panel:not(.collapsed) #log {
          max-height: 18vh;
        }

        #touch-controls.visible {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="display" tabindex="-1"></div>
    <div id="touch-capture-layer" aria-hidden="true"></div>
    <div id="panel" class="collapsed">
      <div id="status">Loading CheerpJ...</div>
      <div class="actions">
        <button id="launch-main" type="button">Run main()</button>
        <button id="launch-jar" type="button">Run jar</button>
        <button id="clear-log" type="button">Clear log</button>
        <button id="toggle-panel" type="button">Show log</button>
      </div>
      <a id="login-link" href="#" rel="noopener">Complete network login</a>
      <div id="log"></div>
    </div>
    <div id="touch-controls" aria-label="Touch controls">
      <button id="zoom-out" type="button" title="Zoom out">-</button>
      <button id="zoom-reset" type="button" title="Reset zoom">1x</button>
      <button id="zoom-in" type="button" title="Zoom in">+</button>
      <button id="show-keyboard" type="button" title="Show keyboard">KB</button>
    </div>
    <input id="keyboard-proxy" class="keyboard-proxy" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text">
    <div id="input-debug-layer"></div>
    <div id="layout-debug-badge"></div>
    <div id="tap-marker"></div>
    <script>
      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const loginLink = document.getElementById("login-link");
      const displayEl = document.getElementById("display");
      const touchCaptureLayerEl = document.getElementById("touch-capture-layer");
      const touchControlsEl = document.getElementById("touch-controls");
      const keyboardProxyEl = document.getElementById("keyboard-proxy");
      const inputDebugLayerEl = document.getElementById("input-debug-layer");
      const layoutDebugBadgeEl = document.getElementById("layout-debug-badge");
      const tapMarkerEl = document.getElementById("tap-marker");
      const wrapperConfig = window.RT4_WRAPPER_CONFIG || {};
      const queryParams = new URLSearchParams(window.location.search);
      const tapDebugEnabled = wrapperConfig.tapDebug === true || queryParams.has("tapdebug");
      const inputDebugEnabled = wrapperConfig.inputDebug === true || queryParams.has("inputdebug");
      const gestureDebugEnabled = wrapperConfig.gestureDebug === true || queryParams.has("gesturedebug");
      const layoutDebugEnabled = wrapperConfig.layoutDebug === true || queryParams.has("layoutdebug");
      const layoutBadgeEnabled = wrapperConfig.layoutBadge === true || queryParams.has("showlayoutbadge");
      const mouseDebugEnabled = wrapperConfig.mouseDebug === true || queryParams.has("mousedebug");
      const wheelDebugEnabled = wrapperConfig.wheelDebug === true || queryParams.has("wheeldebug");
      const wrapperDebugEnabled = wrapperConfig.debug === true || queryParams.has("debug");
      const serverLogEnabled = wrapperConfig.serverLog === true || queryParams.has("serverlog");
      const serverLogUrl = wrapperConfig.serverLogUrl || "/rt4-wrapper-diag";
      const wrapperLogEnabled = wrapperConfig.log === true || queryParams.has("log") || wrapperDebugEnabled || tapDebugEnabled || inputDebugEnabled || gestureDebugEnabled || layoutDebugEnabled || mouseDebugEnabled || wheelDebugEnabled || wrapperConfig.showLogByDefault === true;
      const logPanelEnabled = wrapperConfig.showLogButton === true || wrapperConfig.showLogByDefault === true || queryParams.has("log") || queryParams.has("showlogbutton");
      const maxLogLines = Math.max(20, Number(wrapperConfig.maxLogLines || 120));
      const loginKeyboardFallbackEnabled = wrapperConfig.loginKeyboardFallback !== false;
      const loginKeyboardFallbackStates = new Set(wrapperConfig.loginKeyboardFallbackStates || [10, 20]);

      function appAssetPath(configValue, fallbackFile) {
        const value = String(configValue || "").trim();
        const pageBase = window.location.pathname.replace(/\/[^/]*$/, "/");
        const normalizedBase = pageBase.endsWith("/") ? pageBase : pageBase + "/";

        if (!value) return "/app" + normalizedBase + fallbackFile;
        if (value.startsWith("/app/")) return value;
        if (/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) return value;

        if (value.startsWith("/")) {
          const filenameOnly = value === "/" + fallbackFile;
          return "/app" + (filenameOnly ? normalizedBase + fallbackFile : value);
        }

        return "/app" + normalizedBase + value.replace(/^\.?\//, "");
      }

      function runtimePrefersMobileJars() {
        if (queryParams.has("mobilejars")) return true;
        if (queryParams.has("desktopjars")) return false;
        if (wrapperConfig.forceMobileJars === true) return true;
        if (wrapperConfig.forceDesktopJars === true) return false;
        if (queryParams.has("forcetouch") || wrapperConfig.forceTouchHarness === true) return true;
        const coarse = window.matchMedia("(hover: none), (pointer: coarse)").matches;
        const fineDesktop = window.matchMedia("(any-hover: hover) and (any-pointer: fine)").matches;
        return coarse && !fineDesktop;
      }

      function selectRuntimeAsset(defaultName, desktopName, mobileName) {
        if (runtimePrefersMobileJars()) return mobileName || defaultName;
        return desktopName || defaultName;
      }

      const rt4ClientJarName = selectRuntimeAsset(
        wrapperConfig.clientJar,
        wrapperConfig.desktopClientJar,
        wrapperConfig.mobileClientJar
      );
      const rt4LauncherJarName = selectRuntimeAsset(
        wrapperConfig.launcherJar,
        wrapperConfig.desktopLauncherJar,
        wrapperConfig.mobileLauncherJar
      );
      const rt4ClientJar = appAssetPath(rt4ClientJarName, "client-1.0.0.jar");
      const rt4LauncherJar = appAssetPath(rt4LauncherJarName, "rt4-spike-launcher.jar");
      window.__rt4SelectedJars = {
        mobile: runtimePrefersMobileJars(),
        clientJar: rt4ClientJarName,
        launcherJar: rt4LauncherJarName,
        clientPath: rt4ClientJar,
        launcherPath: rt4LauncherJar,
      };
      let initialized = false;
      let displayCreated = false;
      let running = false;
      const wrapperLogLines = [];
      let lastCheerpJSizeKey = "";
      let layoutSyncRaf = 0;
      let lastPreloadLogAt = 0;
      let lastPreloadDone = -1;
      let lastDesktopPrimaryMouseDownAt = 0;
      let lastDesktopSecondaryMouseDownAt = 0;
      let lastDesktopPrimaryMouseUpAt = 0;
      let lastDesktopSecondaryMouseUpAt = 0;
      let desktopMouseBridgeActive = false;
      let desktopSuppressClickUntil = 0;
      let browserResizeVersion = 1;
      let lastLogicalSizeKey = "";
      let lastViewportSizeKey = "";
      let lastServerLayoutLogAt = 0;
      let nextSocketId = 1;
      const browserSockets = new Map();
      let pageLifecycleClosing = false;
      const browserInputKeyQueue = [];
      const browserInputCharQueue = [];
      const browserInputKeyDownQueue = [];
      const browserInputKeyUpQueue = [];
      const browserInputMouseQueue = [];
      let browserInputMouseEvent = null;
      let browserInputWheelRotation = 0;
      let browserInputCameraZoom = 0;
      let browserInputCameraYaw = 0;
      let browserInputCameraPitch = 0;
      let browserGameState = 0;
      let browserGameplayLayoutActive = false;
      let keyboardViewportLock = null;
      let lastStableKeyboardViewport = null;
      let keyboardViewportUnlockTimer = 0;
      let keyboardActiveField = null;
      let browserLoginState = {
        valid: false,
        loginStep: 0,
        loginReply: -2,
        loginAutoStep: 0,
        createStep: 0,
        worldListStep: 0,
        topLevelInterface: -1,
      };
      let keyboardProxyActive = false;
      let keyboardProxyHandledBeforeInput = false;
      let pendingKeyboardRefocus = null;
      let loginFallbackSuppressedUntil = 0;
      let loginFallbackArmedUntil = 0;
      let browserInputFrame = {
        gameState: 0,
        canvasWidth: 0,
        canvasHeight: 0,
        fields: [],
      };
      window.__rt4InputFields = browserInputFrame.fields;
      window.__rt4InputFrame = browserInputFrame;
      const touchState = {
        enabled: wrapperConfig.mobileTouch !== false,
        fitScale: 1,
        fitScaleX: 1,
        fitScaleY: 1,
        userScale: Number(wrapperConfig.initialScale || 1),
        minUserScale: Number(wrapperConfig.minScale || 1),
        maxUserScale: Number(wrapperConfig.maxScale || 2.5),
        logicalWidth: window.innerWidth,
        logicalHeight: window.innerHeight,
        offsetX: 0,
        offsetY: 0,
        keyboardLiftY: 0,
        keyboardManualOffsetX: 0,
        keyboardManualOffsetY: 0,
        rotated: false,
        rotatePortrait: wrapperConfig.rotatePortrait === true,
        activeMouse: false,
        mouseDownSent: false,
        tapCanceled: false,
        singleTouchId: null,
        inputHit: null,
        pinch: null,
        longPressTimer: null,
        longPressFired: false,
        keyboardPanMode: false,
        keyboardPanMoved: false,
        keyboardPanStartOffsetX: 0,
        keyboardPanStartOffsetY: 0,
        contextMenuSelecting: false,
        scrollMode: false,
        swipeMode: false,
        swipeKey: null,
        touchStartInScrollZone: false,
        swipeReleaseTimer: 0,
        swipeLastKeyAt: 0,
        scrollRemainderY: 0,
        swipeRemainderX: 0,
        swipeRemainderY: 0,
        swipeLastX: 0,
        swipeLastY: 0,
        startX: 0,
        startY: 0,
        lastX: 0,
        lastY: 0,
        lastTapAt: 0,
        lastTouchEndAt: 0,
        suppressClickUntil: 0,
      };
      window.__rt4TouchState = touchState;

      function isPanelExpanded() {
        const panel = document.getElementById("panel");
        return panel && !panel.classList.contains("collapsed");
      }

      function writeLog(message, options = {}) {
        if (options.debugOnly === true && !wrapperLogEnabled) return;
        const shouldPersist = options.important === true || wrapperLogEnabled || isPanelExpanded();
        if (!shouldPersist) return;
        const line = new Date().toLocaleTimeString() + " " + message;
        wrapperLogLines.push(line);
        while (wrapperLogLines.length > maxLogLines) {
          wrapperLogLines.shift();
        }
        logEl.textContent = wrapperLogLines.join("\n");
        if (isPanelExpanded()) {
          logEl.scrollTop = logEl.scrollHeight;
        }
        if (options.important === true || wrapperLogEnabled) {
          console.log("[rt4-wrapper]", message);
        }
      }

      const rt4ConsoleLogLines = [];
      window.__rt4ConsoleLog = rt4ConsoleLogLines;
      let capturingRt4ConsoleLine = false;

      function captureRt4ConsoleLine(level, args) {
        if (capturingRt4ConsoleLine) return;
        let text = "";
        try {
          text = args.map(arg => {
            if (arg instanceof Error) return arg.stack || arg.message;
            if (typeof arg === "string") return arg;
            return JSON.stringify(arg);
          }).join(" ");
        } catch (_) {
          text = args.map(String).join(" ");
        }
        if (!/(Clientscript|CS2 - scr:|ScriptRunner|NullPointerException|RuntimeException|^Error:)/i.test(text)) {
          return;
        }
        const line = level + " " + text;
        rt4ConsoleLogLines.push(new Date().toISOString() + " " + line);
        while (rt4ConsoleLogLines.length > 80) {
          rt4ConsoleLogLines.shift();
        }
        capturingRt4ConsoleLine = true;
        try {
          writeLog(line, { important: true });
        } finally {
          capturingRt4ConsoleLine = false;
        }
      }

      for (const level of ["log", "warn", "error"]) {
        const original = console[level] && console[level].bind(console);
        if (!original) continue;
        console[level] = (...args) => {
          captureRt4ConsoleLine(level, args);
          original(...args);
        };
      }

      function setStatus(message) {
        statusEl.textContent = message;
        writeLog(message, { important: true });
      }

      function sendServerDiagnostic(kind, payload = {}) {
        if (!serverLogEnabled) return;
        const params = new URLSearchParams();
        params.set("kind", kind);
        params.set("t", String(Date.now()));
        const version = queryParams.get("v");
        if (version) params.set("v", version);
        for (const [key, value] of Object.entries(payload)) {
          if (value === undefined || value === null) continue;
          let out;
          if (typeof value === "object") {
            out = JSON.stringify(value);
          } else {
            out = String(value);
          }
          params.set(key, out.slice(0, 240));
        }
        const url = serverLogUrl + "?" + params.toString();
        try {
          fetch(url, {
            method: "GET",
            cache: "no-store",
            credentials: "same-origin",
            keepalive: true,
          }).catch(() => {});
        } catch (_) {
          const image = new Image();
          image.src = url;
        }
      }

      window.addEventListener("error", event => {
        setStatus("Browser error: " + (event.message || "unknown"));
      });

      window.addEventListener("unhandledrejection", event => {
        const reason = event.reason && event.reason.message ? event.reason.message : String(event.reason);
        setStatus("Unhandled rejection: " + reason);
      });

      document.getElementById("clear-log").addEventListener("click", () => {
        wrapperLogLines.length = 0;
        logEl.textContent = "";
      });

      document.getElementById("toggle-panel").addEventListener("click", () => {
        const panel = document.getElementById("panel");
        const collapsed = panel.classList.toggle("collapsed");
        document.getElementById("toggle-panel").textContent = collapsed ? "Show log" : "Hide log";
      });

      function setPanelVisible(visible) {
        const panel = document.getElementById("panel");
        panel.classList.toggle("collapsed", !visible);
        document.getElementById("toggle-panel").textContent = visible ? "Hide log" : "Show log";
      }

      function setPanelAvailable(available) {
        document.getElementById("panel").style.display = available ? "" : "none";
      }

      setPanelAvailable(logPanelEnabled);
      setPanelVisible(wrapperConfig.showLogByDefault === true || queryParams.has("log"));
      if (tapDebugEnabled) {
        writeLog("Tap debug enabled.");
      }
      if (inputDebugEnabled) {
        writeLog("Input debug overlay enabled.");
      }
      if (gestureDebugEnabled) {
        writeLog("Gesture debug enabled.");
      }
      if (layoutDebugEnabled) {
        writeLog("Layout debug enabled.");
      }
      if (mouseDebugEnabled) {
        writeLog("Mouse debug enabled.");
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function numberOption(name, fallback) {
        const raw = queryParams.has(name) ? queryParams.get(name) : wrapperConfig[name];
        const value = Number(raw);
        return Number.isFinite(value) ? value : fallback;
      }

      function booleanOption(name, fallback) {
        if (queryParams.has(name)) {
          const value = queryParams.get(name);
          return value === "" || value === "1" || value === "true" || value === "yes";
        }
        if (typeof wrapperConfig[name] === "boolean") {
          return wrapperConfig[name];
        }
        return fallback;
      }

      function cssPixelVariable(name) {
        const raw = getComputedStyle(document.documentElement).getPropertyValue(name);
        const value = parseFloat(raw);
        return Number.isFinite(value) ? value : 0;
      }

      function safeAreaInsets() {
        if (!shouldUseTouchHarness() || booleanOption("mobileSafeArea", true) === false) {
          return { top: 0, right: 0, bottom: 0, left: 0 };
        }
        const padding = clamp(numberOption("mobileSafeAreaPadding", 4), 0, 32);
        return {
          top: cssPixelVariable("--rt4-safe-area-top") + padding,
          right: cssPixelVariable("--rt4-safe-area-right") + padding,
          bottom: cssPixelVariable("--rt4-safe-area-bottom") + padding,
          left: cssPixelVariable("--rt4-safe-area-left") + padding,
        };
      }

      function suppressCompatibilityClick(reason, durationMs = 220) {
        touchState.suppressClickUntil = Math.max(touchState.suppressClickUntil, Date.now() + durationMs);
        if (gestureDebugEnabled) {
          recordGesture("compat-click-suppress", { reason, durationMs });
        }
      }

      function suppressDesktopCompatibilityClick(reason, durationMs = 350) {
        desktopSuppressClickUntil = Math.max(desktopSuppressClickUntil, Date.now() + durationMs);
        if (gestureDebugEnabled) {
          recordGesture("desktop-compat-click-suppress", { reason, durationMs });
        }
      }

      const audioUnlockState = {
        context: null,
        unlocked: false,
        lastResumeAt: 0,
        silentStarted: false,
        recreatedOnGesture: false,
      };

      const browserAudioState = {
        channels: new Map(),
        sampleRate: 22050,
        stereo: false,
        gain: null,
        supported: false,
        writes: 0,
        dropped: 0,
        silentWrites: 0,
        nonSilentWrites: 0,
        lastWriteAt: 0,
        lastWriteChannel: null,
        lastFrameCount: 0,
        lastSampleCount: 0,
        lastNonZeroSamples: 0,
        lastPeakRaw: 0,
        lastPeakFloat: 0,
        lastRmsRaw: 0,
        lastRmsFloat: 0,
        maxPeakRaw: 0,
        maxPeakFloat: 0,
        maxRmsFloat: 0,
        lastScale: 0,
        lastTestToneAt: 0,
      };

      function resetBrowserAudioTiming(leadSeconds = 0.03) {
        const context = audioUnlockState.context;
        for (const channel of browserAudioState.channels.values()) {
          channel.nextTime = context ? context.currentTime + leadSeconds : 0;
        }
      }

      function canUseBrowserAudio() {
        const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
        return Boolean(AudioContextCtor);
      }

      function audioContext(forceNew = false, createIfMissing = true) {
        const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextCtor) return null;
        if (forceNew && audioUnlockState.context) {
          try {
            audioUnlockState.context.close();
          } catch (_) {
          }

          if (browserAudioState.writes === 1 || browserAudioState.writes % 128 === 0) {
            publishBrowserAudioState("native-write");
          }
        } catch (error) {
          browserAudioState.dropped++;
          writeLog("Browser audio write failed: " + (error && error.message ? error.message : error));
          publishBrowserAudioState("native-write-error");
        }
      }

      function Java_rt4_BrowserAudioNative_close(lib, channelId) {
        const channel = browserAudioState.channels.get(Number(channelId) || 0);
        if (channel) {
          channel.nextTime = 0;
        }
        publishBrowserAudioState("native-close");
      }

      function Java_rt4_BrowserInputNative_pollWheelRotation() {
        const rotation = browserInputWheelRotation;
        browserInputWheelRotation = 0;
        return rotation;
      }

      function Java_rt4_BrowserInputNative_pollCameraZoom() {
        const zoom = browserInputCameraZoom;
        browserInputCameraZoom = 0;
        return zoom;
      }

      function Java_rt4_BrowserInputNative_pollCameraYaw() {
        const yaw = Math.trunc(browserInputCameraYaw);
        browserInputCameraYaw -= yaw;
        return yaw;
      }

      function Java_rt4_BrowserInputNative_pollCameraPitch() {
        const pitch = Math.trunc(browserInputCameraPitch);
        browserInputCameraPitch -= pitch;
        return pitch;
      }

      function Java_rt4_BrowserInputNative_pollKeyCode() {
        if (browserInputKeyQueue.length === 0) return -1;
        return browserInputKeyQueue.shift();
      }

      function Java_rt4_BrowserInputNative_pollKeyChar() {
        if (browserInputCharQueue.length === 0) return -1;
        return browserInputCharQueue.shift();
      }

      function Java_rt4_BrowserInputNative_pollKeyDown() {
        if (browserInputKeyDownQueue.length === 0) return -1;
        return browserInputKeyDownQueue.shift();
      }

      function Java_rt4_BrowserInputNative_pollKeyUp() {
        if (browserInputKeyUpQueue.length === 0) return -1;
        return browserInputKeyUpQueue.shift();
      }

      function Java_rt4_BrowserInputNative_pollMouseEventType() {
        if (browserInputMouseQueue.length === 0) {
          browserInputMouseEvent = null;
          return 0;
        }
        browserInputMouseEvent = browserInputMouseQueue.shift();
        switch (browserInputMouseEvent.type) {
          case 1:
          case "move":
            return 1;
          case 2:
          case "down":
            return 2;
          case 3:
          case "up":
            return 3;
          case 4:
          case "exit":
            return 4;
          default:
            return 0;
        }
      }

      function Java_rt4_BrowserInputNative_pollMouseX() {
        return browserInputMouseEvent ? browserInputMouseEvent.x : 0;
      }

      function Java_rt4_BrowserInputNative_pollMouseY() {
        return browserInputMouseEvent ? browserInputMouseEvent.y : 0;
      }

      function Java_rt4_BrowserInputNative_pollMouseButton() {
        return browserInputMouseEvent ? browserInputMouseEvent.button : 1;
      }

      function Java_rt4_BrowserInputNative_setGameState(lib, state) {
        setBrowserGameState(state);
      }

      function Java_rt4_BrowserInputNative_beginInputFrame(lib, state, canvasWidth, canvasHeight) {
        setBrowserGameState(state);
        browserInputFrame = {
          gameState: browserGameState,
          canvasWidth: Number(canvasWidth),
          canvasHeight: Number(canvasHeight),
          fields: [],
        };
        window.__rt4InputFields = browserInputFrame.fields;
        window.__rt4InputFrame = browserInputFrame;
        renderInputDebugOverlay();
      }

      function Java_rt4_BrowserInputNative_setLoginState(lib, loginStep, loginReply, loginAutoStep, createStep, worldListStep, topLevelInterface) {
        browserLoginState = {
          valid: true,
          loginStep: Number(loginStep),
          loginReply: Number(loginReply),
          loginAutoStep: Number(loginAutoStep),
          createStep: Number(createStep),
          worldListStep: Number(worldListStep),
          topLevelInterface: Number(topLevelInterface),
        };
        window.__rt4LoginState = browserLoginState;
        if (browserLoginState.loginStep > 0 || browserLoginState.loginAutoStep > 0 || browserLoginState.loginReply === 2) {
          suppressLoginFallback("rt4-login-transition", 60000);
          if (isKeyboardProxyActive()) {
            hideKeyboard();
          }
        } else if (
          browserLoginState.loginStep === 0 &&
          browserLoginState.loginAutoStep === 0 &&
          browserLoginState.createStep === 0 &&
          browserLoginState.worldListStep === 0 &&
          browserLoginState.loginReply !== 2 &&
          !isInitialLoginOptionsState()
        ) {
          clearLoginFallbackSuppression("rt4-login-form-idle");
        }
      }

      function Java_rt4_BrowserInputNative_reportTextInput(lib, id, x, y, width, height) {
        const field = {
          id: Number(id),
          x: Number(x),
          y: Number(y),
          width: Number(width),
          height: Number(height),
        };
        if (field.width <= 0 || field.height <= 0) return;
        browserInputFrame.fields.push(field);
        window.__rt4InputFields = browserInputFrame.fields;
        window.__rt4InputFrame = browserInputFrame;
        renderInputDebugOverlay();
      }

      async function ensureCheerpJ() {
        if (!initialized) {
          const enableDebug = wrapperDebugEnabled;
          setStatus("Initializing CheerpJ runtime" + (enableDebug ? " with debug logging" : "") + "...");
          const initOptions = {
            version: 8,
            status: "default",
            enableDebug,
            enableInputMethods: true,
            natives: {
              Java_rt4_BrowserWebSocketNative_open,
              Java_rt4_BrowserWebSocketNative_available,
              Java_rt4_BrowserWebSocketNative_readByte,
              Java_rt4_BrowserWebSocketNative_readBytes,
              Java_rt4_BrowserWebSocketNative_sendBytes,
              Java_rt4_BrowserWebSocketNative_sendByte,
              Java_rt4_BrowserWebSocketNative_trySendBytes,
              Java_rt4_BrowserWebSocketNative_trySendByte,
              Java_rt4_BrowserWebSocketNative_close,
              Java_rt4_BrowserViewportNative_getWidth,
              Java_rt4_BrowserViewportNative_getHeight,
              Java_rt4_BrowserViewportNative_isPageVisible,
              Java_rt4_BrowserViewportNative_isResizable,
              Java_rt4_BrowserViewportNative_getResizeVersion,
              Java_rt4_BrowserAudioNative_init,
              Java_rt4_BrowserAudioNative_getQueuedFrames,
              Java_rt4_BrowserAudioNative_write,
              Java_rt4_BrowserAudioNative_close,
              Java_rt4_BrowserInputNative_pollWheelRotation,
              Java_rt4_BrowserInputNative_pollCameraZoom,
              Java_rt4_BrowserInputNative_pollCameraYaw,
              Java_rt4_BrowserInputNative_pollCameraPitch,
              Java_rt4_BrowserInputNative_pollKeyCode,
              Java_rt4_BrowserInputNative_pollKeyChar,
              Java_rt4_BrowserInputNative_pollKeyDown,
              Java_rt4_BrowserInputNative_pollKeyUp,
              Java_rt4_BrowserInputNative_pollMouseEventType,
              Java_rt4_BrowserInputNative_pollMouseX,
              Java_rt4_BrowserInputNative_pollMouseY,
              Java_rt4_BrowserInputNative_pollMouseButton,
              Java_rt4_BrowserInputNative_setGameState,
              Java_rt4_BrowserInputNative_beginInputFrame,
              Java_rt4_BrowserInputNative_setLoginState,
              Java_rt4_BrowserInputNative_reportTextInput,
            },
            preloadProgress: (done, total) => {
              if (total <= 0 || !wrapperLogEnabled) return;
              const now = Date.now();
              if (done === total || done !== lastPreloadDone && now - lastPreloadLogAt > 1000) {
                lastPreloadDone = done;
                lastPreloadLogAt = now;
                writeLog("CheerpJ preload " + done + " / " + total);
              }
            },
          };

          if (wrapperConfig.tailscaleControlUrl) {
            initOptions.tailscaleControlUrl = wrapperConfig.tailscaleControlUrl;
          }

          if (wrapperConfig.tailscaleAuthKey) {
            initOptions.tailscaleAuthKey = wrapperConfig.tailscaleAuthKey;
            writeLog("CheerpJ generalized networking enabled with an auth key.");
          } else if (wrapperConfig.useTailscaleLogin) {
            initOptions.tailscaleLoginUrlCb = function (url) {
              loginLink.href = url;
              loginLink.target = "_blank";
              loginLink.style.display = "inline-block";
              setStatus("Network login required. Open the login link, then return here.");
            };
            writeLog("CheerpJ generalized networking will prompt for login.");
          } else {
            writeLog("Using browser WebSocket bridge at " + defaultWebSocketUrl() + ".");
          }

          await cheerpjInit(initOptions);
          initialized = true;
          setStatus("CheerpJ initialized.");
        }

        if (!displayCreated) {
          setStatus("Creating Java display...");
          const parent = document.getElementById("display");
          cheerpjCreateDisplay(-1, -1, parent);
          displayCreated = true;
          forceCheerpJDisplaySize("display-created");
          setStatus("Java display created.");
        }
      }

      async function launchJar() {
        if (running) return;
        running = true;
        await ensureCheerpJ();
        setStatus("Starting RT4 via java -jar...");
        const exitCode = await cheerpjRunJar(
          rt4ClientJar,
          "--config",
          "/app/config.json",
          "1",
          "live",
          "english",
          "game0"
        );
        setStatus("RT4 jar exited with code " + exitCode + ".");
      }

      async function launchMain() {
        if (running) return;
        running = true;
        await ensureCheerpJ();
        const fpsTarget = browserFpsTarget();
        writeLog("Using RT4 browser FPS target " + fpsTarget + ".");
        setStatus("Starting RT4 via rt4.client main()...");
        const exitCode = await cheerpjRunMain(
          "spike.Rt4SpikeLauncher",
          rt4LauncherJar + ":" + rt4ClientJar,
          "--browser-fps",
          String(fpsTarget),
          "--config",
          "/app/config.json",
          "1",
          "live",
          "english",
          "game0"
        );
        setStatus("RT4 main exited with code " + exitCode + ".");
      }

      document.getElementById("launch-jar").addEventListener("click", () => {
        launchJar().catch(error => {
          running = false;
          setStatus("Run jar failed: " + (error && error.message ? error.message : String(error)));
        });
      });

      document.getElementById("launch-main").addEventListener("click", () => {
        launchMain().catch(error => {
          running = false;
          setStatus("Run main failed: " + (error && error.message ? error.message : String(error)));
        });
      });

      launchMain().catch(error => {
        running = false;
        setStatus("Auto launch failed: " + (error && error.message ? error.message : String(error)));
      });
    </script>
  </body>
</html>
