<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <title>Runescape by Andrew Gower</title>
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="theme-color" content="#000000">
        <meta name="mobile-web-app-capable" content="yes">
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                min-height: 100dvh;
                min-height: -webkit-fill-available;
                margin: 0;
                box-sizing: border-box;
                -webkit-text-size-adjust: 100%;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
                overscroll-behavior: none;
            }

            *,
            *::before,
            *::after {
                box-sizing: inherit;
            }

            body {
                background-color: #000;
                overflow: hidden;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                width: var(--mudclient-vw, 100vw);
                height: var(--mudclient-vh, 100%);
                padding: 0;
            }

            /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
            canvas.emscripten {
                position: fixed;
                top: 0;
                left: 0;
                width: var(--mudclient-vw, 100vw);
                height: var(--mudclient-vh, 100vh);
                border: 0px none;
                touch-action: none;
                background-color: black;
                display: block;
                image-rendering: pixelated;
                transform: translateZ(0);
            }

            canvas.emscripten:focus {
                outline: none;
            }

            .mudclient-font-bold-12 {
                font-size: 12px;
                font-weight: bold;
                /*height: 13px;*/
                margin-top: -6px;
                height: 25px;
            }

            .mudclient-font-bold-14 {
                font-size: 15px;
                font-weight: bold;
                height: 16px;
            }

            .mudclient-font-bold-16 {
                font-size: 16px;
                font-weight: bold;
            }

            .mudclient-keyboard {
                background: none;
                font-family: Arial, sans-serif;
                border: 0;
                color: transparent;
                display: block;
                left: -9999px;
                top: -9999px;
                padding: 0;
                position: absolute;
                resize: none;
                text-align: center;
                transform-origin: 0 0;
                -webkit-text-fill-color: transparent;
                caret-color: transparent;
                opacity: 0.01;
                min-height: 32px;
                min-width: 160px;
                font-size: 16px;
            }

            .mudclient-keyboard:focus {
                outline: none;
            }

            #mudclient-password {
                font-family: monospace;
            }

            #mudclient-login-form {
                display: contents;
            }

            #ios-keyboard-btn {
                display: none !important;
                position: fixed;
                bottom: 40px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 999999;
                background: rgba(30, 30, 30, 0.95);
                color: #ffd700;
                border: 3px solid #ffd700;
                border-radius: 16px;
                padding: 18px 40px;
                font-size: 22px;
                font-weight: bold;
                font-family: -apple-system, Arial, sans-serif;
                cursor: pointer;
                -webkit-tap-highlight-color: rgba(255,215,0,0.3);
                touch-action: manipulation;
            }

            #connection-banner {
                display: none;
                position: fixed;
                left: max(12px, env(safe-area-inset-left));
                right: max(12px, env(safe-area-inset-right));
                top: calc(env(safe-area-inset-top) + 12px);
                z-index: 999997;
                border: 1px solid rgba(255, 215, 0, 0.55);
                border-radius: 12px;
                background: rgba(16, 16, 16, 0.82);
                color: #ffd700;
                padding: 10px 12px;
                font: 600 13px/1.35 -apple-system, BlinkMacSystemFont, sans-serif;
                text-align: center;
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                pointer-events: none;
            }

            #connection-banner.is-error {
                border-color: rgba(255, 91, 91, 0.7);
                color: #ffb4a8;
            }

            #mobile-controls {
                display: none;
                pointer-events: none;
                position: fixed;
                inset: 0;
                z-index: 999998;
            }

            body.mudclient-touch #mobile-controls {
                display: none;
            }

            body.mudclient-touch.mudclient-browser-mobile:not(.mudclient-native-ios) #mobile-controls {
                display: none;
            }

            .mobile-dpad,
            .mobile-actions,
            .mobile-toggle {
                pointer-events: none;
                position: fixed;
                user-select: none;
                -webkit-user-select: none;
            }

            .mobile-dpad {
                bottom: calc(env(safe-area-inset-bottom) + 18px);
                left: calc(env(safe-area-inset-left) + 18px);
                display: grid;
                grid-template-columns: repeat(3, 48px);
                grid-template-rows: repeat(3, 48px);
                gap: 6px;
            }

            .mobile-actions {
                position: fixed;
                right: calc(env(safe-area-inset-right) + 18px);
                bottom: calc(env(safe-area-inset-bottom) + 18px);
                display: grid;
                grid-template-columns: repeat(2, 48px);
                gap: 8px;
            }

            .mobile-toggle {
                top: calc(env(safe-area-inset-top) + 16px);
                right: calc(env(safe-area-inset-right) + 16px);
            }

            .mobile-control {
                pointer-events: auto;
                width: 48px;
                height: 48px;
                border: 1px solid rgba(255, 215, 0, 0.55);
                border-radius: 12px;
                background: rgba(16, 16, 16, 0.58);
                color: #ffd700;
                font: 700 24px/1 -apple-system, BlinkMacSystemFont, sans-serif;
                display: grid;
                place-items: center;
                padding: 0;
                touch-action: none;
                -webkit-tap-highlight-color: transparent;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                cursor: grab;
            }

            .mobile-drag-handle {
                pointer-events: auto;
                width: 36px;
                height: 36px;
                border: 1px solid rgba(255, 215, 0, 0.45);
                border-radius: 10px;
                background: rgba(16, 16, 16, 0.46);
                color: rgba(255, 215, 0, 0.9);
                display: grid;
                place-items: center;
                padding: 0;
                touch-action: none;
                -webkit-tap-highlight-color: transparent;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
            }

            .mobile-drag-handle::before {
                content: "";
                width: 4px;
                height: 4px;
                border-radius: 50%;
                background: currentColor;
                box-shadow:
                    8px 0 0 currentColor,
                    -8px 0 0 currentColor,
                    0 8px 0 currentColor,
                    0 -8px 0 currentColor;
            }

            .mobile-dpad .mobile-drag-handle {
                grid-column: 2;
                grid-row: 2;
                place-self: center;
            }

            .mobile-actions .mobile-drag-handle {
                position: absolute;
                right: 0;
                top: -44px;
            }

            .mobile-control:active,
            .mobile-control.is-active,
            .mobile-drag-handle:active,
            .mobile-drag-handle.is-active {
                background: rgba(255, 215, 0, 0.24);
                transform: scale(0.96);
            }

            .mobile-drag-handle:active,
            .mobile-drag-handle.is-active {
                cursor: grabbing;
            }

            #mobile-controls.is-collapsed .mobile-dpad,
            #mobile-controls.is-collapsed .mobile-actions {
                display: none;
            }

            #mobile-controls.is-collapsed .mobile-toggle .mobile-control {
                opacity: 0.72;
            }

            #mobile-controls.is-idle:not(.is-collapsed) .mobile-dpad,
            #mobile-controls.is-idle:not(.is-collapsed) .mobile-actions {
                opacity: 0.38;
                transition: opacity 0.2s ease;
            }

            #mobile-controls:not(.is-idle) .mobile-dpad,
            #mobile-controls:not(.is-idle) .mobile-actions {
                opacity: 1;
                transition: opacity 0.12s ease;
            }

            .mobile-control[data-key="up"] { grid-column: 2; grid-row: 1; }
            .mobile-control[data-key="left"] { grid-column: 1; grid-row: 2; }
            .mobile-control[data-key="right"] { grid-column: 3; grid-row: 2; }
            .mobile-control[data-key="down"] { grid-column: 2; grid-row: 3; }

            .mobile-arrow {
                width: 0;
                height: 0;
                border-left: 9px solid transparent;
                border-right: 9px solid transparent;
                border-bottom: 13px solid currentColor;
            }

            .mobile-arrow.down { transform: rotate(180deg); }
            .mobile-arrow.left { transform: rotate(-90deg); }
            .mobile-arrow.right { transform: rotate(90deg); }

            .mobile-menu-icon,
            .mobile-keyboard-icon {
                width: 24px;
                height: 18px;
                position: relative;
                display: block;
            }

            .mobile-menu-icon::before,
            .mobile-menu-icon::after,
            .mobile-menu-icon span {
                content: "";
                position: absolute;
                left: 3px;
                right: 3px;
                height: 2px;
                background: currentColor;
                border-radius: 2px;
            }

            .mobile-menu-icon::before { top: 3px; }
            .mobile-menu-icon span { top: 8px; }
            .mobile-menu-icon::after { top: 13px; }

            .mobile-collapse-icon {
                width: 22px;
                height: 22px;
                position: relative;
                display: block;
            }

            .mobile-collapse-icon::before,
            .mobile-collapse-icon::after {
                content: "";
                position: absolute;
                left: 2px;
                right: 2px;
                top: 10px;
                height: 2px;
                background: currentColor;
                border-radius: 2px;
            }

            .mobile-collapse-icon::after {
                transform: rotate(90deg);
            }

            #mobile-controls:not(.is-collapsed) .mobile-collapse-icon::after {
                display: none;
            }

            .mobile-keyboard-icon {
                border: 2px solid currentColor;
                border-radius: 4px;
            }

            .mobile-keyboard-icon::before,
            .mobile-keyboard-icon::after {
                content: "";
                position: absolute;
                left: 4px;
                right: 4px;
                height: 2px;
                background: currentColor;
                border-radius: 2px;
            }

            .mobile-keyboard-icon::before { top: 5px; }
            .mobile-keyboard-icon::after { bottom: 4px; }

            @media (max-width: 420px), (max-height: 420px) {
                .mobile-dpad {
                    grid-template-columns: repeat(3, 42px);
                    grid-template-rows: repeat(3, 42px);
                    gap: 5px;
                    bottom: calc(env(safe-area-inset-bottom) + 12px);
                    left: calc(env(safe-area-inset-left) + 12px);
                }

                .mobile-actions {
                    grid-template-columns: repeat(2, 42px);
                    gap: 6px;
                    bottom: calc(env(safe-area-inset-bottom) + 12px);
                    right: calc(env(safe-area-inset-right) + 12px);
                }

                .mobile-toggle {
                    top: calc(env(safe-area-inset-top) + 12px);
                    right: calc(env(safe-area-inset-right) + 12px);
                }

                .mobile-control {
                    width: 42px;
                    height: 42px;
                    border-radius: 10px;
                    font-size: 21px;
                }
            }
        </style>
    </head>
    <body>
        <canvas
            class="emscripten"
            id="canvas"
            oncontextmenu="event.preventDefault()"
            tabindex="-1"
            autofocus="autofocus"
        ></canvas>

        <form id="mudclient-login-form" autocomplete="on" method="post" action="javascript:void 0">
            <input
                id="mudclient-keyboard"
                class="mudclient-keyboard"
                name="username"
                type="text"
                autocomplete="username"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                inputmode="text"
                enterkeyhint="next"
                aria-label="Username"
            />

            <input
                id="mudclient-password"
                class="mudclient-keyboard"
                name="password"
                type="password"
                autocomplete="current-password"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                inputmode="text"
                enterkeyhint="done"
                aria-label="Password"
            />
        </form>

        <button id="ios-keyboard-btn">Tap to type</button>
        <div id="connection-banner" role="status" aria-live="polite"></div>

        <div id="mobile-controls">
            <div class="mobile-toggle">
                <button type="button" class="mobile-control" data-action="controls-toggle" aria-label="Toggle controls"><span class="mobile-collapse-icon"></span></button>
            </div>
            <div class="mobile-dpad">
                <button type="button" class="mobile-control" data-key="up" aria-label="Move up"><span class="mobile-arrow up"></span></button>
                <button type="button" class="mobile-control" data-key="left" aria-label="Move left"><span class="mobile-arrow left"></span></button>
                <button type="button" class="mobile-drag-handle" data-drag-target=".mobile-dpad" aria-label="Move controls"></button>
                <button type="button" class="mobile-control" data-key="right" aria-label="Move right"><span class="mobile-arrow right"></span></button>
                <button type="button" class="mobile-control" data-key="down" aria-label="Move down"><span class="mobile-arrow down"></span></button>
            </div>
            <div class="mobile-actions">
                <button type="button" class="mobile-drag-handle" data-drag-target=".mobile-actions" aria-label="Move actions"></button>
                <button type="button" class="mobile-control" data-action="zoom-in" aria-label="Zoom in">+</button>
                <button type="button" class="mobile-control" data-action="zoom-out" aria-label="Zoom out">-</button>
                <button type="button" class="mobile-control" data-action="right-click" aria-label="Right click"><span class="mobile-menu-icon"><span></span></span></button>
                <button type="button" class="mobile-control" data-action="keyboard" aria-label="Keyboard"><span class="mobile-keyboard-icon"></span></button>
            </div>
        </div>

        <script>
            (function() {
                var connectionBanner = document.getElementById('connection-banner');
                var nativeConfig = window.rscNativeConfig || {};
                var isNativeIOSWebClient = nativeConfig.platform === 'ios';
                var isAppleMobile =
                    /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (
                        navigator.platform === 'MacIntel' &&
                        navigator.maxTouchPoints > 1
                    );
                var isBrowserMobile =
                    !isNativeIOSWebClient &&
                    (
                        isAppleMobile ||
                        navigator.maxTouchPoints > 0 ||
                        /Android/i.test(navigator.userAgent)
                    );
                var isStandalone =
                    window.navigator.standalone === true ||
                    (
                        window.matchMedia &&
                        window.matchMedia('(display-mode: standalone)').matches
                    );
                var browserInfo = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    maxTouchPoints: navigator.maxTouchPoints || 0,
                    standalone: isStandalone,
                    appleMobile: isAppleMobile,
                    browserMobile: isBrowserMobile,
                    nativeIOS: isNativeIOSWebClient
                };

                document.documentElement.classList.toggle('mudclient-apple-mobile', isAppleMobile);
                document.body.classList.toggle('mudclient-native-ios', isNativeIOSWebClient);
                document.body.classList.toggle('mudclient-browser-mobile', isBrowserMobile);
                document.body.classList.toggle('mudclient-standalone', isStandalone);

                function showConnectionBanner(message, isError) {
                    if (!connectionBanner) {
                        return;
                    }
                    connectionBanner.textContent = message;
                    connectionBanner.classList.toggle('is-error', !!isError);
                    connectionBanner.style.display = 'block';
                }

                function hideConnectionBanner() {
                    if (connectionBanner) {
                        connectionBanner.style.display = 'none';
                    }
                }

                function sendNative(type, body) {
                    try {
                        if (
                            window.webkit &&
                            window.webkit.messageHandlers &&
                            window.webkit.messageHandlers.nativeBridge
                        ) {
                            window.webkit.messageHandlers.nativeBridge.postMessage(
                                Object.assign({ type: type }, body || {})
                            );
                        }
                    } catch (err) {}
                }

                function stringify(value) {
                    if (value instanceof Error) {
                        return value.stack || value.message;
                    }
                    if (typeof value === 'string') {
                        return value;
                    }
                    try {
                        return JSON.stringify(value);
                    } catch (err) {
                        return String(value);
                    }
                }

                window._mudclientWelcomeCloseAssistUntil = 0;
                window._mudclientIsBrowserMobile = isBrowserMobile;
                window._mudclientIsNativeIOSWebClient = isNativeIOSWebClient;
                window._mudclientBrowserInfo = browserInfo;

                console.log('[mudclient] Browser info: ' + JSON.stringify(browserInfo));

                if (
                    isNativeIOSWebClient ||
                    isBrowserMobile
                ) {
                    setInterval(function() {
                        var canvas = document.getElementById('canvas');
                        var heapBytes = 0;
                        var memory = null;
                        if (Module && Module.HEAP8 && Module.HEAP8.buffer) {
                            heapBytes = Module.HEAP8.buffer.byteLength;
                        }
                        if (typeof performance !== 'undefined' && performance.memory) {
                            memory = {
                                jsHeapSizeLimit: performance.memory.jsHeapSizeLimit,
                                totalJSHeapSize: performance.memory.totalJSHeapSize,
                                usedJSHeapSize: performance.memory.usedJSHeapSize
                            };
                        }
                        sendNative('status', {
                            level: 'heartbeat',
                            message: JSON.stringify({
                                href: location.href,
                                visible: document.visibilityState,
                                focused: document.hasFocus(),
                                standalone: isStandalone,
                                browserMobile: isBrowserMobile,
                                nativeIOS: isNativeIOSWebClient,
                                viewport: [window.innerWidth, window.innerHeight],
                                visualViewport: window.visualViewport
                                    ? [
                                        window.visualViewport.offsetLeft,
                                        window.visualViewport.offsetTop,
                                        window.visualViewport.width,
                                        window.visualViewport.height,
                                        window.visualViewport.scale
                                    ]
                                    : null,
                                dpr: window.devicePixelRatio || 1,
                                canvas: canvas ? [canvas.width, canvas.height] : null,
                                canvasCss: canvas ? [canvas.clientWidth, canvas.clientHeight] : null,
                                heapBytes: heapBytes,
                                memory: memory
                            })
                        });
                    }, 5000);
                }

                ['log', 'warn', 'error'].forEach(function(level) {
                    var original = console[level] || console.log;
                    console[level] = function() {
                        var args = Array.prototype.slice.call(arguments);
                        var text = args.map(stringify).join(' ');
                        if (/\bLogin response:\s*0\b/.test(text)) {
                            window._mudclientWelcomeCloseAssistUntil = Date.now() + 90000;
                        }
                        sendNative(level === 'error' ? 'error' : 'log', {
                            level: level,
                            message: text
                        });
                        original.apply(console, args);
                    };
                });

                window._mudclientNativeMessage = sendNative;
                window._mudclientShowConnectionBanner = showConnectionBanner;
                window._mudclientHideConnectionBanner = hideConnectionBanner;

	                if (typeof window.WebSocket === 'function') {
	                    var NativeWebSocket = window.WebSocket;
	                    var CONNECT_TIMEOUT_MS = 12000;

	                    function bytesFromWebSocketPayload(payload) {
	                        if (payload instanceof ArrayBuffer) {
	                            return new Uint8Array(payload);
	                        }
	                        if (ArrayBuffer.isView(payload)) {
	                            return new Uint8Array(
	                                payload.buffer,
	                                payload.byteOffset,
	                                payload.byteLength
	                            );
	                        }
	                        return null;
	                    }

	                    function describeOutgoingPacket(payload) {
	                        var bytes = bytesFromWebSocketPayload(payload);
	                        if (!bytes || bytes.length < 3) {
	                            return null;
	                        }
	                        var packetLength = (bytes[0] << 8) | bytes[1];
	                        var opcode = bytes[2];
	                        return {
	                            opcode: opcode,
	                            packetLength: packetLength,
	                            byteLength: bytes.length
	                        };
	                    }

	                    function MonitoredWebSocket(url, protocols) {
                            console.log(
                                '[mudclient] Opening WebSocket: ' +
                                url +
                                ' protocols=' +
                                (protocols === undefined ? '<none>' : JSON.stringify(protocols)) +
                                ' location=' +
                                location.href
                            );
	                        var socket = protocols === undefined
	                            ? new NativeWebSocket(url)
	                            : new NativeWebSocket(url, protocols);
                        var didOpen = false;
                        var timer = setTimeout(function() {
                            if (didOpen || socket.readyState !== NativeWebSocket.CONNECTING) {
                                return;
                            }
                            var message = 'WebSocket connection timed out: ' + url;
                            showConnectionBanner(message, true);
                            console.error('[mudclient] ' + message);
                            sendNative('error', {
                                level: 'websocket-timeout',
                                message: message
                            });
                            try {
                                socket.close(4000, 'Connection timed out');
                            } catch (err) {}
                        }, CONNECT_TIMEOUT_MS);

	                        socket.addEventListener('open', function() {
	                            didOpen = true;
	                            clearTimeout(timer);
	                            hideConnectionBanner();
	                            console.log('[mudclient] WebSocket connected: ' + url);
                            sendNative('status', {
                                level: 'websocket-open',
                                message: 'Connected to ' + url
                            });
	                        });

	                        socket.addEventListener('error', function(event) {
	                            clearTimeout(timer);
	                            showConnectionBanner('WebSocket error: ' + url, true);
	                            console.error(
	                                '[mudclient] WebSocket error: ' +
	                                url +
	                                ' readyState=' +
	                                socket.readyState,
	                                event
	                            );
	                            sendNative('error', {
	                                level: 'websocket-error',
	                                message: 'WebSocket error: ' +
	                                    url +
	                                    ' readyState=' +
	                                    socket.readyState
	                            });
	                        });

	                        socket.addEventListener('close', function(event) {
	                            clearTimeout(timer);
	                            var message = 'WebSocket closed: ' + url + ' code=' + event.code;
	                            if (event.reason) {
	                                message += ' reason=' + event.reason;
	                            }
	                            message += ' wasClean=' + event.wasClean;
	                            if (!didOpen) {
	                                showConnectionBanner(message, true);
	                            }
                            console.warn('[mudclient] ' + message);
                            sendNative(didOpen ? 'status' : 'error', {
                                level: didOpen ? 'websocket-close' : 'websocket-failed',
	                                message: message
	                            });
	                        });

	                        var nativeSend = socket.send;
	                        socket.send = function(payload) {
	                            var packet = describeOutgoingPacket(payload);
	                            if (packet && packet.opcode === 246) {
	                                var message = 'Outgoing item drop packet: length='
	                                    + packet.packetLength
	                                    + ' bytes='
	                                    + packet.byteLength;
	                                console.log('[mudclient] ' + message);
	                                sendNative('status', {
	                                    level: 'item-drop-packet',
	                                    message: message
	                                });
	                            }
	                            return nativeSend.call(socket, payload);
	                        };

	                        return socket;
	                    }

                    MonitoredWebSocket.prototype = NativeWebSocket.prototype;
                    MonitoredWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
                    MonitoredWebSocket.OPEN = NativeWebSocket.OPEN;
                    MonitoredWebSocket.CLOSING = NativeWebSocket.CLOSING;
                    MonitoredWebSocket.CLOSED = NativeWebSocket.CLOSED;
                    window.WebSocket = MonitoredWebSocket;
                }
            })();

            function LSFS() {
                if (LSFS.mount) {
                    return LSFS;
                }

                var wrapCreateNode = wrapNode(MEMFS.createNode);

                var wrap_node_ops = {
                    setattr: wrapSave(MEMFS.node_ops.setattr),
                    mknod: wrapNode(MEMFS.node_ops.mknod),
                    rename: wrapSave(MEMFS.node_ops.rename),
                    unlink: wrapSave(MEMFS.node_ops.unlink),
                    rmdir: wrapSave(MEMFS.node_ops.rmdir),
                    symlink: wrapNode(MEMFS.node_ops.symlink)
                };

                var wrap_stream_ops = {
                    write: wrapSave(MEMFS.stream_ops.write),
                    msync: wrapSave(MEMFS.stream_ops.msync)
                };

                var props = [
                    'name',
                    'mode',
                    'rdev',
                    'link',
                    'usedBytes',
                    'timestamp'
                ];

                LSFS.mount = mount;

                return LSFS;

                function wrapNode(fn) {
                    return function () {
                        var node = fn.apply(null, arguments);
                        setupNode(node);
                        return node;
                    };
                }

                    touchState.startX = point.x;
                    touchState.startY = point.y;
                    touchState.lastX = point.x;
                    touchState.lastY = point.y;
                    touchState.lastClientX = point.clientX;
                    touchState.lastClientY = point.clientY;
                    touchState.longPressed = false;
                    clearLongPress();

                    touchState.longPressTimer = setTimeout(function() {
                        touchState.longPressed = true;
                        inputBreadcrumb('long-press', true);
                        fireRightClick(touchState.startX, touchState.startY);
                    }, LONG_PRESS_MS);
                    event.preventDefault();
                }, { passive: false });

                canvas.addEventListener('touchmove', function(event) {
                    if (event.touches.length === 2) {
                        var nextDistance = distance(event.touches[0], event.touches[1]);
                        if (touchState.mode !== 'pinch') {
                            touchState.mode = 'pinch';
                            touchState.pinchDistance = nextDistance;
                            clearLongPress();
                            releaseActiveKey();
                            event.preventDefault();
                            return;
                        }

                        var delta = touchState.pinchDistance - nextDistance;
                        if (Math.abs(nextDistance - touchState.pinchStartDistance) > 12) {
                            touchState.pinchMoved = true;
                        }
                        touchState.pinchDistance = nextDistance;
                        wheel(delta * PINCH_WHEEL_SCALE);
                        event.preventDefault();
                        return;
                    }

                    if (event.touches.length !== 1 || !touchState.mode) {
                        return;
                    }

                    var point = touchPoint(event.touches[0]);
                    touchState.lastX = point.x;
                    touchState.lastY = point.y;
                    touchState.lastClientX = point.clientX;
                    touchState.lastClientY = point.clientY;

                    var dx = point.x - touchState.startX;
                    var dy = point.y - touchState.startY;
                    var movement = Math.sqrt(dx * dx + dy * dy);

                    if (movement > SWIPE_THRESHOLD) {
                        clearLongPress();
                        touchState.mode = 'swipe';
                        inputBreadcrumb('swipe dx=' + Math.round(dx) + ' dy=' + Math.round(dy), true);
                        setActiveKey(keyForSwipe(dx, dy));
                        event.preventDefault();
                    }
                }, { passive: false });

                canvas.addEventListener('touchend', function(event) {
                    if (touchState.mode === 'pinch') {
                        if (!touchState.pinchMoved) {
                            fireRightClick(touchState.pinchCenterX, touchState.pinchCenterY);
                        }
                        resetTouchState();
                        event.preventDefault();
                        return;
                    }

                    if (touchState.mode === 'swipe') {
                        resetTouchState();
                        event.preventDefault();
                        return;
                    }

                    clearLongPress();
                    if (touchState.longPressed) {
                        resetTouchState();
                        event.preventDefault();
                        return;
                    }

                    if (touchState.mode === 'tap') {
                        var dx = touchState.lastX - touchState.startX;
                        var dy = touchState.lastY - touchState.startY;
                        var movement = Math.sqrt(dx * dx + dy * dy);
                        if (movement <= TAP_MOVE_THRESHOLD) {
                            fireLeftClick(touchState.lastX, touchState.lastY);
                        }
                        resetTouchState();
                        event.preventDefault();
                    }
                }, { passive: false });

                canvas.addEventListener('touchcancel', function(event) {
                    resetTouchState();
                    event.preventDefault();
                }, { passive: false });

                window.addEventListener('blur', resetTouchState);
                window.addEventListener('pagehide', resetTouchState);
                document.addEventListener('visibilitychange', function() {
                    if (document.hidden) {
                        resetTouchState();
                    }
                });
            })();

            /* ============================================================
               iOS Audio Fix
               Emscripten's SDL2 skips autoResumeAudioContext when
               navigator.userActivation exists (true on modern iOS Safari).
               The fallback uses setInterval which iOS ignores because it's
               not a user gesture. Fix: add our own gesture-based resume.
               ============================================================ */
            (function() {
                function resumeAudio() {
                    var ctx = null;
                    if (typeof Module !== 'undefined' && Module.SDL2 && Module.SDL2.audioContext) {
                        ctx = Module.SDL2.audioContext;
                    } else if (typeof SDL2 !== 'undefined' && SDL2.audioContext) {
                        ctx = SDL2.audioContext;
                    }
                    if (ctx && ctx.state === 'suspended') {
                        ctx.resume();
                    }
                }
                ['touchstart', 'touchend', 'mousedown', 'keydown'].forEach(function(evt) {
                    document.addEventListener(evt, resumeAudio, { once: false });
                });
            })();
        </script>
        <script id="mainScript">
          // Fix: Emscripten's WASM fallback (mudclient.js) appends ?_rwasm=0 via
          // location.href += '?_rwasm=0', but when a # fragment is present the
          // param lands AFTER the hash (e.g. mudclient.html#args?_rwasm=0).
          // location.search stays empty so the check never sees it → infinite
          // redirect loop.  Detect this and fix the URL before anything loads.
          (function() {
            if (location.hash.indexOf('_rwasm=0') >= 0) {
              var cleanHash = location.hash.replace(/[\?&]_rwasm=0/g, '');
              history.replaceState(null, '', location.pathname + '?_rwasm=0' + cleanHash);
            }
          })();

          function loadMainJs() {

            var script = document.createElement('script');
            script.src = "mudclient.js";
            script.onerror = function() {
              if (window._mudclientNativeMessage) {
                window._mudclientNativeMessage('error', {
                  level: 'error',
                  message: 'Failed to load mudclient.js'
                });
              }
            };
            document.body.appendChild(script);

          }
          var isAppleMobile =
            /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          var shouldLoadWasmFallback =
            !window.WebAssembly ||
            (!isAppleMobile && location.search.indexOf('_rwasm=0') > 0);

          if (shouldLoadWasmFallback) {
            // Current browser does not support WebAssembly, load the .wasm.js JavaScript fallback
            // before the main JS runtime.
            var wasm2js = document.createElement('script');
            wasm2js.src = "mudclient.wasm.js";
            wasm2js.onload = loadMainJs;
            wasm2js.onerror = function() {
              if (window._mudclientNativeMessage) {
                window._mudclientNativeMessage('error', {
                  level: 'error',
                  message: 'Failed to load mudclient.wasm.js fallback'
                });
              }
            };
            document.body.appendChild(wasm2js);
          } else {
            // Current browser supports Wasm, proceed with loading the main JS runtime.
            loadMainJs();
          }

</script>
    </body>
