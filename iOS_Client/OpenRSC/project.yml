name: OpenRSC

options:
  bundleIdPrefix: com.openrsc
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  # rsc-c — the same C engine as the WebAssembly browser client — compiled
  # natively with an SDL2-subset shim. Keep these flags in sync with
  # Package.swift and RSCEngine/tools/Makefile. See RSCEngine/README.md.
  RSCEngine:
    type: library.static
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: RSCEngine/rsc-c-src
        excludes:
          - "COPYING"
      - path: RSCEngine/shim
      - path: RSCEngine/include
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: RSCEngine
        GCC_C_LANGUAGE_STANDARD: gnu99
        # ANDROID selects rsc-c's mobile SDL2 path (touch input, 360px-tall
        # scaled UI, SDL_GetPrefPath config). main() becomes rsc_c_main(),
        # which the shim runs on the engine thread.
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) SDL2=1 RENDER_SW=1 ANDROID=1 main=rsc_c_main"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/RSCEngine/shim $(SRCROOT)/RSCEngine/include"
        OTHER_CFLAGS: "$(inherited) -fwrapv"
        GCC_PREFIX_HEADER: "$(SRCROOT)/RSCEngine/shim/rsc_ios_prefix.h"
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        CLANG_ENABLE_MODULES: NO
        SKIP_INSTALL: YES

  OpenRSC:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    dependencies:
      - target: RSCEngine
    sources:
      - path: OpenRSC/Sources
        excludes:
          - "**/.DS_Store"
          - "Rendering/Shaders.metal"
          - "WebClient/**"
      - path: OpenRSC/Sources/WebClient
        type: folder
        buildPhase: resources
      # Bundle the binary game-data archives as resources. They are loaded via
      # Bundle.main.path(forResource:ofType:). See ModelArchiveLoader,
      # LandscapeLoader, SpriteLoader, GameObjectDefinitions, NPCDefinitions.
      - path: OpenRSC/models.orsc
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/Authentic_Landscape.orsc
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/Authentic_Sprites.orsc
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/landscape.dat
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/sprites.dat
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/sprites_v2.dat
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/GameObjectDef.xml
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/DoorDef.xml
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/TileDef.xml
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/NpcDefs.json
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/ItemDefs.json
        type: file
        buildPhase: resources
        optional: true
      # rsc-c game cache (*.jag / *.mem), read by the embedded engine.
      - path: RSCEngine/rsc-cache
        type: folder
        buildPhase: resources
      # Sound effects (37 .wav files + sounds.mem). Mirrors
      # Client_Base/Cache/audio/. Loaded by SoundManager via
      # Bundle.main.url(forResource:withExtension:"wav").
      - path: OpenRSC/Audio
        type: folder
        buildPhase: resources
        optional: true
    info:
      path: OpenRSC/Info.plist
      properties:
        CFBundleDisplayName: OpenRSC
        CFBundleIdentifier: com.openrsc.client
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openrsc.client
        PRODUCT_NAME: OpenRSC
        INFOPLIST_FILE: OpenRSC/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_PREVIEWS: YES
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        DEVELOPMENT_TEAM: MJAYYU2WWD
        CODE_SIGN_IDENTITY: "iPhone Developer"
        CODE_SIGN_STYLE: Automatic
        # Define OPENRSC_APP so OpenRSCApp.swift's @main attribute is active.
        # Without this, the linker can't find _main.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) OPENRSC_APP"
        # Exposes RSCEngine/include/module.modulemap so Swift can `import RSCEngine`.
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/RSCEngine/include"
