name: OpenRSC

options:
  bundleIdPrefix: com.openrsc
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  OpenRSC:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OpenRSC/Sources
        excludes:
          - "**/.DS_Store"
          - "Rendering/Shaders.metal"
          - "WebClient/**"
      - path: OpenRSC/Sources/WebClient
        type: folder
        buildPhase: resources
      # Bundle the binary game-data archives as resources. They are loaded via
      # Bundle.main.path(forResource:ofType:). See ModelArchiveLoader,
      # LandscapeLoader, SpriteLoader, GameObjectDefinitions, NPCDefinitions.
      - path: OpenRSC/models.orsc
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/Authentic_Landscape.orsc
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/Authentic_Sprites.orsc
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/landscape.dat
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/sprites.dat
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/sprites_v2.dat
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/GameObjectDef.xml
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/DoorDef.xml
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/TileDef.xml
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/NpcDefs.json
        type: file
        buildPhase: resources
        optional: true
      - path: OpenRSC/ItemDefs.json
        type: file
        buildPhase: resources
        optional: true
      # Sound effects (37 .wav files + sounds.mem). Mirrors
      # Client_Base/Cache/audio/. Loaded by SoundManager via
      # Bundle.main.url(forResource:withExtension:"wav").
      - path: OpenRSC/Audio
        type: folder
        buildPhase: resources
        optional: true
    info:
      path: OpenRSC/Info.plist
      properties:
        CFBundleDisplayName: OpenRSC
        CFBundleIdentifier: com.openrsc.client
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openrsc.client
        PRODUCT_NAME: OpenRSC
        INFOPLIST_FILE: OpenRSC/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_PREVIEWS: YES
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        DEVELOPMENT_TEAM: MJAYYU2WWD
        CODE_SIGN_IDENTITY: "iPhone Developer"
        CODE_SIGN_STYLE: Automatic
        # Define OPENRSC_APP so OpenRSCApp.swift's @main attribute is active.
        # Without this, the linker can't find _main.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) OPENRSC_APP"
