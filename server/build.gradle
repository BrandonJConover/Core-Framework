plugins {
    id 'java'
    id 'application'
}

group = 'com.openrsc'
version = '2.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Core Networking - Netty
    implementation 'io.netty:netty-all:4.1.121.Final'
    implementation 'io.netty.incubator:netty-incubator-codec-classes-quic:0.0.72.Final'
    runtimeOnly 'io.netty.incubator:netty-incubator-codec-native-quic:0.0.72.Final:osx-aarch_64'

    // Database
    implementation 'mysql:mysql-connector-java:8.0.33'
    implementation 'org.xerial:sqlite-jdbc:3.44.0.0'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'redis.clients:jedis:5.1.0'

    // Logging
    implementation 'org.apache.logging.log4j:log4j-api:2.22.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.22.0'
    implementation 'org.apache.logging.log4j:log4j-iostreams:2.22.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.22.0'
    implementation 'com.lmax:disruptor:3.4.4'

    // Serialization
    implementation 'org.msgpack:msgpack-core:0.9.6'
    implementation 'org.msgpack:jackson-dataformat-msgpack:0.9.6'
    implementation 'com.google.flatbuffers:flatbuffers-java:24.3.25'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Observability - OpenTelemetry
    implementation platform('io.opentelemetry:opentelemetry-bom:1.33.0')
    implementation 'io.opentelemetry:opentelemetry-api'
    implementation 'io.opentelemetry:opentelemetry-sdk'
    implementation 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.opentelemetry:opentelemetry-exporter-prometheus:1.33.0-alpha'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:1.33.0'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-netty-4.1:1.33.0-alpha'

    // Prometheus Metrics
    implementation 'io.micrometer:micrometer-core:1.12.1'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.12.1'
    implementation 'io.prometheus:simpleclient:0.16.0'
    implementation 'io.prometheus:simpleclient_httpserver:0.16.0'
    implementation 'io.prometheus:simpleclient_hotspot:0.16.0'

    // Service Discovery
    implementation 'com.orbitz.consul:consul-client:1.5.3'
    implementation 'io.etcd:jetcd-core:0.7.6'

    // Azure Integration
    implementation 'com.azure:azure-identity:1.11.0'
    implementation 'com.azure.spring:spring-cloud-azure-appconfiguration-config:5.8.0'
    implementation 'com.microsoft.azure:applicationinsights-core:3.4.17'

    // HTTP Server for Health/Metrics
    implementation 'io.javalin:javalin:5.6.3'

    // Utilities
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'org.apache.commons:commons-compress:1.18'
    implementation 'commons-codec:commons-codec:1.16.0'
    implementation 'com.google.guava:guava:32.1.3-jre'
    implementation 'com.thoughtworks.xstream:xstream:1.4.18'
    implementation 'com.vdurmont:emoji-java:5.1.1'
    implementation 'org.gitlab4j:gitlab4j-api:4.12.17'
    implementation files(
        'lib/guice-5.0.2-jar-with-dependencies.jar',
        'lib/JDA-4.0.0_55-withDependencies.jar'
    )

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'org.mockito:mockito-core:5.8.0'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['conf']
        }
    }
}

application {
    mainClass = 'com.openrsc.server.Server'
    applicationDefaultJvmArgs = [
        '-Xms2G',
        '-Xmx4G',
        '-XX:+UseG1GC',
        '-XX:+UseStringDeduplication',
        '-Dlog4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector'
    ]
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.openrsc.server.Server',
            'Implementation-Title': 'OpenRSC Server',
            'Implementation-Version': version
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

task runServer(type: JavaExec) {
    mainClass = 'com.openrsc.server.Server'
    classpath = sourceSets.main.runtimeClasspath
    args = ['default.conf']
    jvmArgs = [
        '-Xms2G',
        '-Xmx4G',
        '-XX:+UseG1GC',
        '-Dlog4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector'
    ]
}
