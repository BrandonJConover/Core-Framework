name: Deploy Server

on:
  push:
    branches: [develop, main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build fat JAR
        working-directory: server
        run: gradle8 clean jar

      - name: Verify JAR exists
        run: ls -lh server/build/libs/openrsc-server-*.jar

      - name: Restart server service
        run: |
          cp server/build/libs/openrsc-server-*.jar /opt/openrsc/server/build/libs/
          systemctl restart openrsc
          sleep 8
          systemctl is-active openrsc

      - name: Health check
        run: |
          # Give server up to 30s to start listening
          for i in $(seq 1 6); do
            if ss -tlnp | grep -q ':43594'; then
              echo "Server is listening on port 43594"
              exit 0
            fi
            echo "Waiting for server... ($i/6)"
            sleep 5
          done
          echo "ERROR: Server did not start listening within 30s"
          journalctl -u openrsc -n 30 --no-pager
          exit 1
