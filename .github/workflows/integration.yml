name: integration

on:
  workflow_run:
    workflows: [smoke]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: integration-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: Web client Playwright scenarios
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCENARIO_URL: ${{ secrets.WEB_CLIENT_URL }}
      SCENARIO_USER: ${{ secrets.WEB_CLIENT_USER }}
      SCENARIO_PASSWORD: ${{ secrets.WEB_CLIENT_PASSWORD }}
      SCENARIO_BROWSER: webkit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Deployment_Scripts/playwright/package-lock.json

      - name: Require deployed web-client URL
        run: test -n "$SCENARIO_URL"

      - name: Install Playwright
        run: |
          cd Deployment_Scripts/playwright
          npm ci
          npx playwright install webkit --with-deps

      - name: Run scenarios
        run: |
          cd Deployment_Scripts/playwright
          npm run scenarios

      - name: Upload screenshots and event logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}
          path: /tmp/mudclient-playwright
          retention-days: 7
