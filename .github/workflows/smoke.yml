name: smoke

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java desktop + modern server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Compile desktop client
        run: ant -f Client_Base/build.xml compile

      - name: Compile modern server core + plugins
        run: ant -f server-java-modern/build.xml compile_core compile_plugins

  web:
    name: 2009scape web client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone base client and apply patch overlay
        run: |
          cd 2009scape-web
          ./setup.sh

      - name: Verify patched web bundle exists
        run: test -f 2009scape-web/client/dist/index.html

  ios:
    name: iOS compile-only
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: |
          cd iOS_Client/OpenRSC
          xcodegen generate

      - name: Build generic iOS target
        run: |
          cd iOS_Client/OpenRSC
          set -o pipefail
          xcodebuild -project OpenRSC.xcodeproj -scheme OpenRSC \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/openrsc-ci \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions

  summary:
    name: All smoke tests passed
    needs: [java, web, ios]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All smoke tests are green."
